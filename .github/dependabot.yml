# Janus has no third-party Go modules (docs/adr/001-dependencies.md), so the
# only dependencies to keep current are the GitHub Actions the workflows
# use. They are pinned to commit SHAs; Dependabot proposes new ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
