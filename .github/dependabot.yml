# Janus has no third-party Go modules (docs/adr/001-dependencies.md), so the
# dependencies to keep current are the GitHub Actions the workflows use,
# pinned to commit SHAs, and the docs site's npm packages (ADR-002), pinned
# by its package-lock.json. Dependabot proposes new ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    labels: [chore]
    groups:
      docusaurus:
        patterns: ["@docusaurus/*", "react", "react-dom", "@mdx-js/react", "prism-react-renderer", "clsx"]
