name: fuzz

# A short fuzz run for each target that reads untrusted input (#137). The
# seeds and any saved failures in testdata/fuzz already run as ordinary
# tests in the test workflow; this looks for new ones.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/anthropic, target: FuzzParseRequest }
          - { pkg: ./internal/anthropic, target: FuzzObserverIgnoresHowTheBodyIsCut }
          - { pkg: ./internal/guard, target: FuzzRestoreAnyCut }
          - { pkg: ./internal/guard, target: FuzzDataHeredocs }
          - { pkg: ./internal/mcp, target: FuzzServe }
          - { pkg: ./internal/digest, target: FuzzExcerpt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s
      # A failure is written to testdata/fuzz; keep it, to commit as a
      # regression case.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: "**/testdata/fuzz/**"
