name: release

# A tag such as v1.2.3 builds the binaries and publishes a release. On a
# pull request the same build runs and nothing is published, so that a
# change which breaks the release is found before the tag is.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Choose the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-pr.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # The full suite, stress tests included, has already passed on this
      # commit in the test workflow; here the tests only confirm the build.
      - run: go test -short -timeout 5m ./...
      - run: scripts/release.sh "${{ steps.version.outputs.version }}"
      - name: Run the binary that was built
        run: |
          cd dist
          sha256sum -c checksums.txt
          tar -xzf janus_*_linux_amd64.tar.gz
          got="$(./janus_*_linux_amd64/janus version)"
          echo "$got"
          test "$got" = "janus ${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: a short-lived identity token, and
      # permission to record the attestation against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # A signed statement that each archive was built by this workflow from
      # the tagged commit, which anyone can check with gh attestation verify.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes $prerelease
