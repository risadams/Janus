name: release

# A tag such as v1.2.3 builds the binaries and publishes a release. On a
# pull request the same build runs and nothing is published, so that a
# change which breaks the release is found before the tag is.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Choose the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-pr.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # The full suite, stress tests included, has already passed on this
      # commit in the test workflow; here the tests only confirm the build.
      - run: go test -short -timeout 5m ./...
      - run: scripts/release.sh "${{ steps.version.outputs.version }}"
      # The archives as built, before the darwin binaries are signed: what
      # the reproduce job rebuilds, and what the codesign job signs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.cdx.json
          retention-days: 7

  # The darwin binaries are signed with the owner's Developer ID and
  # notarized by Apple, so that macOS runs a copy downloaded in a browser
  # (#262). Only Apple's own tools touch the certificate (ADR-004). A pull
  # request has no business with the certificate, so it signs ad hoc
  # instead, which tests the unpacking, signing, and repacking without it.
  codesign:
    needs: build
    runs-on: macos-latest
    # The certificate and the notary key are secrets of the release
    # environment, which GitHub gives only to a run for a v* tag (#324). A
    # pull request's run uses no environment, and no secret.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: built
      # A keychain made for this run, holding only the certificate, and
      # deleted at the end however the job goes.
      - name: Load the Developer ID certificate
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="${RUNNER_TEMP}/janus-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security import "${RUNNER_TEMP}/developer-id.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="(${APPLE_TEAM_ID})" '/"Developer ID Application: / && index($0, team) { print $2; exit }')"
          [ -n "$identity" ] || { echo "MACOS_CERTIFICATE_P12 holds no Developer ID Application certificate for team ${APPLE_TEAM_ID}"; exit 1; }
          echo "KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "IDENTITY=${identity}" >> "$GITHUB_ENV"
      # With the hardened runtime and a secure timestamp, as notarization
      # requires. Janus needs no entitlements. The archives are packed
      # again as release.sh packs them, so only the binary changes.
      - name: Sign the darwin binaries
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          go build -o "${RUNNER_TEMP}/archive" ./scripts/archive
          mkdir -p signed notarize
          for archive in built/janus_*_darwin_*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            work="${RUNNER_TEMP}/${name}"
            mkdir -p "$work"
            tar -xzf "$archive" -C "$work"
            binary="${work}/${name}/janus"
            if [ -n "${IDENTITY:-}" ]; then
              codesign --force --options runtime --timestamp --identifier io.github.risadams.janus \
                --keychain "$KEYCHAIN" --sign "$IDENTITY" "$binary"
            else
              codesign --force --options runtime --timestamp=none --identifier io.github.risadams.janus \
                --sign - "$binary"
            fi
            codesign --verify --strict --verbose=2 "$binary"
            mkdir -p "notarize/${name}"
            cp "$binary" "notarize/${name}/janus"
            "${RUNNER_TEMP}/archive" -o "signed/${name}.tar.gz" "${work}/${name}"
          done
          ls signed
          [ "$(ls signed | wc -l)" -eq 2 ] || { echo "expected two darwin archives"; exit 1; }
      # A bare binary cannot have its ticket stapled to it, so Gatekeeper
      # fetches the ticket from Apple the first time the binary runs.
      - name: Notarize
        if: github.ref_type == 'tag'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          ditto -c -k notarize "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "${RUNNER_TEMP}/notarized.json" || true
          cat "${RUNNER_TEMP}/notarized.json"
          status="$(jq -r '.status // empty' "${RUNNER_TEMP}/notarized.json")"
          if [ "$status" != "Accepted" ]; then
            id="$(jq -r '.id // empty' "${RUNNER_TEMP}/notarized.json")"
            [ -z "$id" ] || xcrun notarytool log "$id" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            echo "Apple did not notarize the binaries (status: ${status:-none}); its log is above"
            exit 1
          fi
      - name: Run the signed binary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/run"
          tar -xzf signed/janus_*_darwin_arm64.tar.gz -C "${RUNNER_TEMP}/run"
          binary="$(echo "${RUNNER_TEMP}"/run/janus_*_darwin_arm64/janus)"
          codesign --display --verbose=2 "$binary"
          got="$("$binary" version)"
          echo "$got"
          test "$got" = "janus ${VERSION}"
      - if: always()
        name: Remove the keychain and the notary key
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN"
          rm -f "${RUNNER_TEMP}/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-signed
          path: signed/*.tar.gz
          retention-days: 7

  # The release as it will be published: the signed darwin archives in
  # place of the built ones, and checksums.txt written over them and
  # signed. The sums as built are kept beside it, as
  # checksums-before-codesign.txt, for anyone rebuilding the release.
  seal:
    needs: [build, codesign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-signed
          path: dist
      - name: Write the checksums
        run: |
          cd dist
          mv checksums.txt checksums-before-codesign.txt
          sha256sum janus_*.tar.gz janus_*.zip > checksums.txt
          cat checksums.txt
          # Only the darwin archives may differ from the build.
          diff <(grep -v _darwin_ checksums-before-codesign.txt) <(grep -v _darwin_ checksums.txt)
          [ "$(diff checksums-before-codesign.txt checksums.txt | grep -c '^>')" -eq 2 ] ||
            { echo "signing should have changed exactly the two darwin archives"; exit 1; }
      # A tag is signed with the release key, and the signature is checked
      # against the keys Janus is built with, so a release Janus cannot
      # check is never published. A pull request signs with a key made for
      # the run, so that signing is tested before a tag depends on it.
      - name: Sign the checksums
        id: sign
        env:
          JANUS_RELEASE_KEY: ${{ github.ref_type == 'tag' && secrets.JANUS_RELEASE_KEY || '' }}
        run: |
          keys=internal/update/release-keys.txt
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            keys="${RUNNER_TEMP}/release-keys.txt"
            JANUS_RELEASE_KEY="$(go run ./scripts/signsums -new -keys "$keys")"
            export JANUS_RELEASE_KEY
          fi
          go run ./scripts/signsums -keys "$keys" dist/checksums.txt
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
      # The check SECURITY.md gives people, with OpenSSL rather than Go.
      - name: Check the signature by hand
        env:
          KEYS: ${{ steps.sign.outputs.keys }}
        run: |
          key="$(grep -v '^#' "$KEYS" | head -n 1)"
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$key" | base64 -d; } > "${RUNNER_TEMP}/janus-release.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "${RUNNER_TEMP}/janus-release.der" \
            -rawin -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      # Every installed Janus updates itself from a release laid out like
      # this one; a change to the layout would break them all (ADR-004).
      - name: Check janus update can install every build
        env:
          KEYS: ${{ steps.sign.outputs.keys }}
          VERSION: ${{ needs.build.outputs.version }}
        run: go run ./scripts/checklayout -keys "$KEYS" dist "$VERSION"
      - name: Run the binary that was built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c checksums.txt
          tar -xzf janus_*_linux_amd64.tar.gz
          got="$(./janus_*_linux_amd64/janus version)"
          echo "$got"
          test "$got" = "janus ${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums-before-codesign.txt
            dist/*.cdx.json
          retention-days: 7

  # Anyone can rebuild a release from its tag and get the same bytes
  # (#264). This proves it on every build: another OS, another folder,
  # another clock, and the same checksums.txt as the build job's.
  reproduce:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: somewhere/else/janus
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: built
      - name: Rebuild and compare
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TZ: Pacific/Auckland
        run: |
          cd somewhere/else/janus
          umask 077
          scripts/release.sh "$VERSION" > /dev/null
          diff -u "$GITHUB_WORKSPACE/built/checksums.txt" dist/checksums.txt

  # Each SBOM gets a signed attestation binding it to its archive, so
  # gh attestation verify can check what went into a build (#263). One
  # job per platform, since the action takes one SBOM at a time. It runs
  # on pull requests too, attesting nothing, so that a mistake in finding
  # the files fails a pull request rather than a release.
  attest-sbom:
    needs: [seal, reproduce]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [darwin_arm64, darwin_amd64, linux_amd64, linux_arm64, windows_amd64, windows_arm64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Find the archive
        id: archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=tar.gz
          case "$TARGET" in windows_*) ext=zip ;; esac
          set -- dist/janus_*_"${TARGET}.${ext}"
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one archive for ${TARGET}, found: $*"; exit 1; }
          sbom="${1%."${ext}"}.cdx.json"
          [ -f "$sbom" ] || { echo "no SBOM for ${TARGET} at ${sbom}"; exit 1; }
          # What actions/attest asks of a CycloneDX SBOM before it will
          # attest it; checked here so a pull request finds a gap first.
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | type == "string") and (.specVersion | type == "string")' "$sbom" > /dev/null ||
            { echo "${sbom} lacks bomFormat, serialNumber, or specVersion, so it cannot be attested"; exit 1; }
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "sbom=${sbom}" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
          sbom-path: ${{ steps.archive.outputs.sbom }}

  # The Homebrew formula, installed from the archives this run built, so
  # that a change which breaks it fails a pull request rather than the tap
  # (#260). The formula is the one the tap job writes, with file URLs.
  homebrew:
    needs: [build, seal]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the formula and run its test
        env:
          VERSION: ${{ needs.build.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap-new --no-git janus-ci/test > /dev/null
          tap="$(brew --repository janus-ci/test)"
          scripts/formula.sh "$VERSION" dist/checksums.txt "file://${GITHUB_WORKSPACE}/dist" > "${tap}/Formula/janus.rb"
          brew style janus-ci/test/janus
          brew install janus-ci/test/janus
          brew test janus-ci/test/janus
          prefix="$(brew --prefix)"
          for f in etc/bash_completion.d/janus share/zsh/site-functions/_janus share/fish/vendor_completions.d/janus.fish; do
            test -s "${prefix}/${f}" || { echo "the formula did not install ${f}"; exit 1; }
          done

  publish:
    if: github.ref_type == 'tag'
    needs: [seal, reproduce, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: a short-lived identity token, and
      # permission to record the attestation against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # A signed statement that each archive was built by this workflow from
      # the tagged commit, which anyone can check with gh attestation verify.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The attestation also goes up with the release, so that it can be
      # checked without asking GitHub for it (gh attestation verify
      # --bundle), and so that tools looking for provenance beside a
      # release, as OpenSSF Scorecard does (#266), find it.
      - name: Keep the provenance with the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/janus_${GITHUB_REF_NAME#v}.intoto.jsonl"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          # The notes open with the tag's message, the summary for people
          # that tag-release.sh asks for, above the list of pull requests
          # GitHub generates. The tag is signed, so its message ends in the
          # signature, which is left off.
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)"
          summary="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag}" --jq .message | sed '/-----BEGIN SSH SIGNATURE-----/,$d')"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
            --notes "$summary" --generate-notes $prerelease

  # On a stable tag, once the release is public, the formula in
  # risadams/homebrew-tap moves to it, so brew upgrade finds it (#260). A
  # release candidate never reaches the tap. The deploy key can write to
  # the tap and nothing else (ADR-004). Running it again for the same tag
  # changes nothing.
  tap:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [publish, homebrew]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: risadams/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --dir "${RUNNER_TEMP}"
          mkdir -p tap/Formula
          scripts/formula.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/checksums.txt" > tap/Formula/janus.rb
          grep -o 'https://[^"]*' tap/Formula/janus.rb | while read -r url; do
            curl -fsSLI -o /dev/null "$url" || { echo "the formula names ${url}, which does not download"; exit 1; }
          done
      - name: Push it to the tap
        working-directory: tap
        run: |
          git add Formula/janus.rb
          if git diff --cached --quiet; then echo "the tap already has ${GITHUB_REF_NAME}"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "janus ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD
