name: release

# A tag such as v1.2.3 builds the binaries and publishes a release. On a
# pull request the same build runs and nothing is published, so that a
# change which breaks the release is found before the tag is.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Choose the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-pr.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # The full suite, stress tests included, has already passed on this
      # commit in the test workflow; here the tests only confirm the build.
      - run: go test -short -timeout 5m ./...
      - run: scripts/release.sh "${{ steps.version.outputs.version }}"
      # A tag is signed with the release key, and the signature is checked
      # against the keys Janus is built with, so a release Janus cannot
      # check is never published. A pull request signs with a key made for
      # the run, so that signing is tested before a tag depends on it.
      - name: Sign the checksums
        id: sign
        env:
          JANUS_RELEASE_KEY: ${{ github.ref_type == 'tag' && secrets.JANUS_RELEASE_KEY || '' }}
        run: |
          keys=internal/update/release-keys.txt
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            keys="${RUNNER_TEMP}/release-keys.txt"
            JANUS_RELEASE_KEY="$(go run ./scripts/signsums -new -keys "$keys")"
            export JANUS_RELEASE_KEY
          fi
          go run ./scripts/signsums -keys "$keys" dist/checksums.txt
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
      # The check SECURITY.md gives people, with OpenSSL rather than Go.
      - name: Check the signature by hand
        env:
          KEYS: ${{ steps.sign.outputs.keys }}
        run: |
          key="$(grep -v '^#' "$KEYS" | head -n 1)"
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$key" | base64 -d; } > "${RUNNER_TEMP}/janus-release.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "${RUNNER_TEMP}/janus-release.der" \
            -rawin -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      # Every installed Janus updates itself from a release laid out like
      # this one; a change to the layout would break them all (ADR-004).
      - name: Check janus update can install every build
        env:
          KEYS: ${{ steps.sign.outputs.keys }}
          VERSION: ${{ steps.version.outputs.version }}
        run: go run ./scripts/checklayout -keys "$KEYS" dist "$VERSION"
      - name: Run the binary that was built
        run: |
          cd dist
          sha256sum -c checksums.txt
          tar -xzf janus_*_linux_amd64.tar.gz
          got="$(./janus_*_linux_amd64/janus version)"
          echo "$got"
          test "$got" = "janus ${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/*.cdx.json
          retention-days: 7

  # Anyone can rebuild a release from its tag and get the same bytes
  # (#264). This proves it on every build: another OS, another folder,
  # another clock, and the same checksums.txt as the build job's.
  reproduce:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: somewhere/else/janus
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: built
      - name: Rebuild and compare
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TZ: Pacific/Auckland
        run: |
          cd somewhere/else/janus
          umask 077
          scripts/release.sh "$VERSION" > /dev/null
          diff -u "$GITHUB_WORKSPACE/built/checksums.txt" dist/checksums.txt

  # Each SBOM gets a signed attestation binding it to its archive, so
  # gh attestation verify can check what went into a build (#263). One
  # job per platform, since the action takes one SBOM at a time. It runs
  # on pull requests too, attesting nothing, so that a mistake in finding
  # the files fails a pull request rather than a release.
  attest-sbom:
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [darwin_arm64, darwin_amd64, linux_amd64, linux_arm64, windows_amd64, windows_arm64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Find the archive
        id: archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=tar.gz
          case "$TARGET" in windows_*) ext=zip ;; esac
          set -- dist/janus_*_"${TARGET}.${ext}"
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one archive for ${TARGET}, found: $*"; exit 1; }
          sbom="${1%."${ext}"}.cdx.json"
          [ -f "$sbom" ] || { echo "no SBOM for ${TARGET} at ${sbom}"; exit 1; }
          # What actions/attest asks of a CycloneDX SBOM before it will
          # attest it; checked here so a pull request finds a gap first.
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | type == "string") and (.specVersion | type == "string")' "$sbom" > /dev/null ||
            { echo "${sbom} lacks bomFormat, serialNumber, or specVersion, so it cannot be attested"; exit 1; }
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "sbom=${sbom}" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
          sbom-path: ${{ steps.archive.outputs.sbom }}

  publish:
    if: github.ref_type == 'tag'
    needs: [build, reproduce, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: a short-lived identity token, and
      # permission to record the attestation against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # A signed statement that each archive was built by this workflow from
      # the tagged commit, which anyone can check with gh attestation verify.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The attestation also goes up with the release, so that it can be
      # checked without asking GitHub for it (gh attestation verify
      # --bundle), and so that tools looking for provenance beside a
      # release, as OpenSSF Scorecard does (#266), find it.
      - name: Keep the provenance with the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/janus_${GITHUB_REF_NAME#v}.intoto.jsonl"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes $prerelease
