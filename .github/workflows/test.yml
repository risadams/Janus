name: test

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code. Saying so keeps them read-only even if the
# repository's default token permissions change (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod's floor, 1.27, which is also the toolchain this repo is
        # developed on. When a newer Go release ships, add it here, so a
        # break it introduces shows up before anyone builds with it.
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go build ./...
      # The suite takes about 15 s. A test that hangs fails at the timeout
      # with Go's list of running tests and a goroutine dump, instead of
      # holding the check open until the job is cancelled (#211).
      - run: go test ./... -timeout 5m -v -coverpkg=./... -coverprofile=coverage.out
      # Coverage across packages: a package's code exercised by another
      # package's tests counts. Reported, not enforced.
      - name: Coverage
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
          echo "Statement coverage across packages: ${total}" >> "$GITHUB_STEP_SUMMARY"
          echo "coverage ${total}"

  # The release ships binaries for these too, so the suite runs on them.
  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test ./... -timeout 5m

  # Known vulnerabilities in the code Janus calls, from the standard library
  # up. Janus has no third-party modules, so this watches the Go release.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  # Security rules CodeQL's default suite does not have: file permissions,
  # dropped errors, decompression bombs (#298). Any finding fails the job,
  # after it has gone to the Security tab beside CodeQL's, where it shows
  # against the line. A finding that is safe says why on its line, with
  # `_ =` or `// #nosec <rule> -- <reason>`.
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To show the findings under the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: scripts/gosec.sh -no-fail -fmt sarif -out gosec.sarif ./...
      # A pull request from a fork gets a read-only token, so the upload
      # is skipped there rather than failing the job.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: No findings
        run: |
          count="$(jq '.runs[0].results | length' gosec.sarif)"
          echo "gosec findings: ${count}" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[0].results[] | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine): \(.ruleId) \(.message.text)"' gosec.sarif
          test "${count}" -eq 0
