<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-first-title local-first-desc" id="local-first-root">
        <title id="local-first-title">What local-first costs in time</title>
        <desc id="local-first-desc">A subagent turn answered by Claude alone streams at once and is done in one to three seconds; with local-then-escalate the local answer is held back while it is checked, shown after about 34 seconds at the median if it passes, and if it fails Claude answers after that wait.</desc>
        <defs>
      <style>#local-first-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #local-first-root { font-family: var(--font-serif); color: var(--color-ink); }
      #local-first-root .diagram-container { width: 100%; overflow-x: auto; }
      #local-first-root .diagram-container { overflow-x: visible; }</style>
          <marker id="local-first-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="local-first-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="local-first-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Time axis -->
        <line x1="200" y1="196" x2="880" y2="196" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <line x1="200" y1="196" x2="200" y2="202" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <text x="200" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">0 s</text>
        <line x1="370" y1="196" x2="370" y2="202" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <text x="370" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">10 s</text>
        <line x1="540" y1="196" x2="540" y2="202" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <text x="540" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">20 s</text>
        <line x1="710" y1="196" x2="710" y2="202" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <text x="710" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">30 s</text>
        <line x1="880" y1="196" x2="880" y2="202" stroke="#1a1614" stroke-width="1" stroke-opacity="0.30"/>
        <text x="880" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">40 s</text>
        <line x1="778" y1="20" x2="778" y2="196" stroke="#1a1614" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Claude alone -->
        <text x="30" y="46" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Claude alone</text>
        <text x="30" y="62" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">route upstream</text>
        <rect x="200" y="32" width="34" height="32" rx="4" fill="#faf6ef"/>
        <rect x="200" y="32" width="34" height="32" rx="4" fill="#1a5b6e" stroke="#1a5b6e" stroke-width="1" fill-opacity="0.10"/>
        <text x="246" y="52" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">streams at once, done in 1 to 3 s</text>

        <!-- Local answer accepted -->
        <text x="30" y="102" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Local, accepted</text>
        <text x="30" y="118" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">local-then-escalate</text>
        <rect x="200" y="88" width="578" height="32" rx="4" fill="#faf6ef"/>
        <rect x="200" y="88" width="578" height="32" rx="4" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="489" y="107" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">held back while it is checked</text>
        <text x="790" y="108" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">shown at 34 s</text>

        <!-- Local answer rejected -->
        <text x="30" y="158" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Local, rejected</text>
        <text x="30" y="174" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">local-then-escalate</text>
        <rect x="200" y="144" width="578" height="32" rx="4" fill="#faf6ef"/>
        <rect x="200" y="144" width="578" height="32" rx="4" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="489" y="163" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">held back, then thrown away</text>
        <rect x="778" y="144" width="34" height="32" rx="4" fill="#faf6ef"/>
        <rect x="778" y="144" width="34" height="32" rx="4" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="824" y="164" fill="#CB0162" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">then Claude</text>
        <text x="489" y="248" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">Claude Code shows nothing until a local answer passes its checks</text>

        <!-- Legend -->
        <line x1="30" y1="272" x2="930" y2="272" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="300" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="289" width="24" height="14" rx="4" fill="#faf6ef"/>
        <rect x="100" y="289" width="24" height="14" rx="4" fill="#1a5b6e" stroke="#1a5b6e" stroke-width="1" fill-opacity="0.10"/>
        <text x="132" y="300" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Claude answers</text>
        <rect x="250" y="289" width="24" height="14" rx="4" fill="#faf6ef"/>
        <rect x="250" y="289" width="24" height="14" rx="4" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="282" y="300" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">The local model answers</text>
        <rect x="440" y="289" width="24" height="14" rx="4" fill="#faf6ef"/>
        <rect x="440" y="289" width="24" height="14" rx="4" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="472" y="300" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Claude, after the local answer failed</text>
      </svg>
