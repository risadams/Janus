<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prompt-cache-title prompt-cache-desc" id="prompt-cache-root">
        <title id="prompt-cache-title">Why a block once sent never changes</title>
        <desc id="prompt-cache-desc">Each turn of a conversation resends everything before it. Blocks sent unchanged are read from the prompt cache at a tenth of the input price; if one earlier block changes, it and everything after it are written to the cache again at twice the input price, so Janus sends every block in the same bytes on every turn.</desc>
  <defs>
      <style>#prompt-cache-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #prompt-cache-root { font-family: var(--font-serif); color: var(--color-ink); }
      #prompt-cache-root .diagram-container { width: 100%; overflow-x: auto; }
      #prompt-cache-root .diagram-container { overflow-x: visible; }</style>
  </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Column heads -->
        <text x="252" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SYSTEM</text>
        <text x="386" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TOOLS</text>
        <text x="518" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 1</text>
        <text x="630" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 2</text>
        <text x="742" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 3</text>
        <text x="868" y="20" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">COST</text>

        <!-- Row 1: the first request writes everything -->
        <text x="30" y="56" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">First request</text>
        <text x="30" y="72" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">all new</text>
        <rect x="196" y="36" width="112" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="252" y="62" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <rect x="312" y="36" width="148" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="386" y="62" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <rect x="464" y="36" width="108" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="518" y="62" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="62" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">all written</text>

        <!-- Row 2: the next turn reads what it sent before -->
        <text x="30" y="128" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Next turn</text>
        <text x="30" y="144" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">same bytes again</text>
        <rect x="196" y="108" width="112" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="252" y="134" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="108" width="148" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="386" y="134" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="108" width="108" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="518" y="134" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="576" y="108" width="108" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="630" y="134" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="134" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">mostly read</text>

        <!-- Row 3: an earlier block was changed -->
        <text x="30" y="200" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">If turn 1 changed</text>
        <text x="30" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">what Janus never does</text>
        <rect x="196" y="180" width="112" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="252" y="206" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="180" width="148" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="386" y="206" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="180" width="108" height="44" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="518" y="206" fill="#CB0162" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">changed</text>
        <rect x="576" y="180" width="108" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="630" y="206" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write again</text>
        <rect x="688" y="180" width="108" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="742" y="206" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="206" fill="#CB0162" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">all after it written</text>
        <!-- Bracket under what is written again -->
        <path d="M 464,232 V 240 H 796 V 232" fill="none" stroke="#6b625a" stroke-width="1"/>
        <text x="630" y="256" fill="#6b625a" font-size="13" font-style="italic" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">everything from the change on is paid for again, twenty times a read</text>

        <!-- Row 4: what Janus does -->
        <text x="30" y="304" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">As Janus sends it</text>
        <text x="30" y="320" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">a change made once, kept</text>
        <rect x="196" y="284" width="112" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="252" y="310" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="284" width="148" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="386" y="310" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="284" width="108" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="518" y="310" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="576" y="284" width="108" height="44" rx="6" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="630" y="310" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="688" y="284" width="108" height="44" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="742" y="310" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="310" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">mostly read</text>

        <!-- Legend -->
        <line x1="30" y1="352" x2="930" y2="352" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="380" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="370" width="24" height="14" rx="3" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="132" y="380" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Read from the cache: a tenth of the input price</text>
        <rect x="380" y="370" width="24" height="14" rx="3" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="412" y="380" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Written to the cache: twice the input price</text>
        <rect x="640" y="370" width="24" height="14" rx="3" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="672" y="380" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">A block sent before, now different</text>
      </svg>
