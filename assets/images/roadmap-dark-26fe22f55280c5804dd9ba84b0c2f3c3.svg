<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmap-dark-title roadmap-dark-desc" id="roadmap-dark-root">
        <title id="roadmap-dark-title">How the milestones depend on each other</title>
        <desc id="roadmap-dark-desc">Milestones M0 to M5 lead in order to M7, the 1.0 release; M6 Guard needs only M2 and also leads to 1.0; M8 Pace needs M3 and, like M9 Distribution, runs beside 1.0 without holding it up. M10 Providers needs M3 and M8 and leads to M11 Codex CLI and M12 Triage, which together are the v0.10.0 release.</desc>
        <defs>
      <style>#roadmap-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #roadmap-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #roadmap-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #roadmap-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="roadmap-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
