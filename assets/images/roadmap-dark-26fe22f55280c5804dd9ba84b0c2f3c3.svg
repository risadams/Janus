        <text x="30" y="352" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">V0.10.0</text>
        <text x="30" y="372" fill="#a89e8f" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">Claude, Codex, or local behind one Janus</text>
        <text x="30" y="468" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">measure before changing anything, and take the cheapest, safest savings first</text>
        <text x="930" y="468" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">M8 and M9 run beside 1.0 and don’t hold it up</text>
