<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Janus sits</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Janus · Ris Ink</p>
    <h1>Where Janus sits</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Where Janus sits</title>
        <desc id="architecture-desc">Claude Code sends every request to Janus, which forwards most of them to the Anthropic API, sends the ones its rules choose to a local model in LM Studio, and records each in a ledger on disk; the janus mcp server gives Claude tools the local model carries out.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Arrows first -->
        <!-- Claude Code to Janus: the headline path -->
        <line x1="200" y1="172" x2="318" y2="172" stroke="#CB0162" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="216" y="146" width="88" height="12" rx="2" fill="#faf6ef"/>
        <text x="260" y="155" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY REQUEST</text>

        <!-- Janus to the Anthropic API -->
        <path d="M 520,160 H 592 Q 600,160 600,152 V 100 Q 600,92 608,92 H 678" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="608" y="120" width="36" height="12" rx="2" fill="#faf6ef"/>
        <text x="626" y="129" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <!-- Janus to LM Studio, only for what the rules send local -->
        <path d="M 520,184 H 592 Q 600,184 600,192 V 244 Q 600,252 608,252 H 678" fill="none" stroke="#6b625a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="608" y="212" width="64" height="12" rx="2" fill="#faf6ef"/>
        <text x="640" y="221" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BY RULE</text>

        <!-- Janus writes the ledger and captures -->
        <line x1="420" y1="140" x2="420" y2="90" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="428" y="108" width="44" height="12" rx="2" fill="#faf6ef"/>
        <text x="450" y="117" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>

        <!-- Claude Code to janus mcp -->
        <path d="M 120,204 V 324 Q 120,332 128,332 H 318" fill="none" stroke="#6b625a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="128" y="262" width="60" height="12" rx="2" fill="#faf6ef"/>
        <text x="158" y="271" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MCP TOOLS</text>

        <!-- janus mcp to LM Studio -->
        <path d="M 520,332 H 782 Q 790,332 790,324 V 286" fill="none" stroke="#6b625a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="616" y="310" width="76" height="12" rx="2" fill="#faf6ef"/>
        <text x="654" y="319" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WORKER CALLS</text>

        <!-- Nodes -->
        <!-- Claude Code: input -->
        <rect x="40" y="140" width="160" height="64" rx="6" fill="#faf6ef"/>
        <rect x="40" y="140" width="160" height="64" rx="6" fill="rgba(107,98,90,0.10)" stroke="#776e65" stroke-width="1"/>
        <rect x="48" y="146" width="40" height="12" rx="2" fill="transparent" stroke="rgba(119,110,101,0.40)" stroke-width="0.8"/>
        <text x="68" y="155" fill="#776e65" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="120" y="178" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Claude Code</text>
        <text x="120" y="194" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ANTHROPIC_BASE_URL</text>

        <!-- Janus: focal -->
        <rect x="320" y="140" width="200" height="64" rx="6" fill="#faf6ef"/>
        <rect x="320" y="140" width="200" height="64" rx="6" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1.2"/>
        <rect x="328" y="146" width="36" height="12" rx="2" fill="transparent" stroke="rgba(203,1,98,0.40)" stroke-width="0.8"/>
        <text x="346" y="155" fill="#CB0162" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
        <text x="420" y="178" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Janus</text>
        <text x="420" y="194" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>

        <!-- Logs: store -->
        <rect x="320" y="24" width="200" height="64" rx="6" fill="#faf6ef"/>
        <rect x="320" y="24" width="200" height="64" rx="6" fill="rgba(26,22,20,0.05)" stroke="#6b625a" stroke-width="1"/>
        <rect x="328" y="30" width="32" height="12" rx="2" fill="transparent" stroke="rgba(107,98,90,0.40)" stroke-width="0.8"/>
        <text x="344" y="39" fill="#6b625a" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="420" y="62" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">logs/</text>
        <text x="420" y="78" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ledger · captures · originals</text>

        <!-- janus mcp: backend -->
        <rect x="320" y="300" width="200" height="64" rx="6" fill="#faf6ef"/>
        <rect x="320" y="300" width="200" height="64" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <rect x="328" y="306" width="28" height="12" rx="2" fill="transparent" stroke="rgba(26,22,20,0.40)" stroke-width="0.8"/>
        <text x="342" y="315" fill="rgba(26,22,20,0.8)" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="420" y="338" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">janus mcp</text>
        <text x="420" y="354" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ask_files · tool_output</text>

        <!-- Anthropic API: external -->
        <rect x="680" y="60" width="220" height="64" rx="6" fill="#faf6ef"/>
        <rect x="680" y="60" width="220" height="64" rx="6" fill="rgba(26,22,20,0.03)" stroke="rgba(26,22,20,0.30)" stroke-width="1"/>
        <rect x="688" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(26,91,110,0.40)" stroke-width="0.8"/>
        <text x="702" y="75" fill="#1a5b6e" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="790" y="98" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Anthropic API</text>
        <text x="790" y="114" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>

        <!-- LM Studio: backend -->
        <rect x="680" y="220" width="220" height="64" rx="6" fill="#faf6ef"/>
        <rect x="680" y="220" width="220" height="64" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <rect x="688" y="226" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,22,20,0.40)" stroke-width="0.8"/>
        <text x="706" y="235" fill="rgba(26,22,20,0.8)" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="790" y="258" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">LM Studio</text>
        <text x="790" y="274" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">studio.local:1234</text>

        <!-- Legend -->
        <line x1="30" y1="392" x2="930" y2="392" stroke="rgba(26,22,20,0.10)" stroke-width="0.8"/>
        <text x="30" y="420" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="410" width="16" height="12" rx="2" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1"/>
        <text x="124" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Janus</text>
        <line x1="180" y1="416" x2="212" y2="416" stroke="#CB0162" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="220" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Request path</text>
        <line x1="310" y1="416" x2="342" y2="416" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="350" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">To Anthropic</text>
        <line x1="440" y1="416" x2="472" y2="416" stroke="#6b625a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="480" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Only when configured</text>
        <rect x="600" y="410" width="16" height="12" rx="2" fill="rgba(26,22,20,0.05)" stroke="#6b625a" stroke-width="1"/>
        <text x="624" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">On disk</text>
        <rect x="690" y="410" width="16" height="12" rx="2" fill="rgba(26,22,20,0.03)" stroke="rgba(26,22,20,0.30)" stroke-width="1"/>
        <text x="714" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">External</text>
      </svg>
    </div>
  </div>
</body>
</html>
