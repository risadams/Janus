<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ask-files-dark-title ask-files-dark-desc" id="ask-files-dark-root">
        <title id="ask-files-dark-title">Handing reading to the local model</title>
        <desc id="ask-files-dark-desc">Claude calls the ask_files tool; Claude Code passes it to janus mcp, which has the local model read the files in passes and answer; Claude gets a short answer with file and line references instead of the files.</desc>
        <defs>
      <style>#ask-files-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #ask-files-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #ask-files-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #ask-files-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ask-files-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="ask-files-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="ask-files-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Lifelines -->
        <line x1="130" y1="72" x2="130" y2="420" stroke="#f4ecdd" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="370" y1="72" x2="370" y2="420" stroke="#f4ecdd" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="610" y1="72" x2="610" y2="420" stroke="#f4ecdd" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="850" y1="72" x2="850" y2="420" stroke="#f4ecdd" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Messages -->
        <line x1="130" y1="120" x2="364" y2="120" stroke="#5ba3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ask-files-dark-arrow-link)"/>
        <rect x="157" y="98" width="186" height="14" rx="2" fill="#1a1614"/>
        <text x="250" y="108" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">call ask_files(paths, question)</text>
        <line x1="370" y1="168" x2="604" y2="168" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#ask-files-dark-arrow)"/>
        <rect x="459" y="146" width="62" height="14" rx="2" fill="#1a1614"/>
        <text x="490" y="156" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ask_files</text>
        <line x1="610" y1="216" x2="844" y2="216" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#ask-files-dark-arrow)"/>
        <rect x="654" y="194" width="152" height="14" rx="2" fill="#1a1614"/>
        <text x="730" y="204" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the files, read in passes</text>
        <line x1="850" y1="280" x2="616" y2="280" stroke="#a89e8f" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ask-files-dark-arrow)"/>
        <rect x="665" y="258" width="130" height="14" rx="2" fill="#1a1614"/>
        <text x="730" y="268" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">notes, then an answer</text>
        <line x1="610" y1="328" x2="376" y2="328" stroke="#a89e8f" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ask-files-dark-arrow)"/>
        <rect x="397" y="306" width="186" height="14" rx="2" fill="#1a1614"/>
        <text x="490" y="316" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">about 300 words, with file:line</text>
        <line x1="370" y1="392" x2="136" y2="392" stroke="#e24a8a" stroke-width="1.4" marker-end="url(#ask-files-dark-arrow-accent)"/>
        <rect x="157" y="370" width="186" height="14" rx="2" fill="#1a1614"/>
        <text x="250" y="380" fill="#948b7d" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the short answer, not the files</text>

        <!-- Actors -->
        <rect x="50" y="20" width="160" height="52" rx="6" fill="#1a1614"/>
        <rect x="50" y="20" width="160" height="52" rx="6" fill="#f4ecdd" stroke="#f4ecdd" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="130" y="44" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude</text>
        <text x="130" y="60" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>
        <rect x="290" y="20" width="160" height="52" rx="6" fill="#1a1614"/>
        <rect x="290" y="20" width="160" height="52" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="370" y="44" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <text x="370" y="60" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">your machine</text>
        <rect x="530" y="20" width="160" height="52" rx="6" fill="#1a1614"/>
        <rect x="530" y="20" width="160" height="52" rx="6" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="610" y="44" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">janus mcp</text>
        <text x="610" y="60" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ask_files</text>
        <rect x="770" y="20" width="160" height="52" rx="6" fill="#1a1614"/>
        <rect x="770" y="20" width="160" height="52" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="850" y="44" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="850" y="60" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the local model</text>
        <text x="370" y="448" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">the files never enter Claude’s context</text>
        <text x="730" y="448" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">about a minute per 45 kB read</text>
        <line x1="30" y1="468" x2="930" y2="468" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="496" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="492" x2="132" y2="492" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#ask-files-dark-arrow-link)"/>
        <text x="140" y="496" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">From Anthropic</text>
        <line x1="260" y1="492" x2="292" y2="492" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#ask-files-dark-arrow)"/>
        <text x="300" y="496" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">On your machine</text>
        <line x1="420" y1="492" x2="452" y2="492" stroke="#e24a8a" stroke-width="1.4" marker-end="url(#ask-files-dark-arrow-accent)"/>
        <text x="460" y="496" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">What Claude reads instead of the files</text>
      </svg>
