<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compress-dark-title compress-dark-desc" id="compress-dark-root">
        <title id="compress-dark-title">How compression keeps the original</title>
        <desc id="compress-dark-desc">A large tool result is digested by the local model before it goes to Anthropic, and the digest is sent in the same bytes on every turn; Janus keeps the original, which Claude can fetch through the tool_output tool of janus mcp.</desc>
        <defs>
      <style>#compress-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #compress-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #compress-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #compress-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="compress-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="compress-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="compress-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Arrows first -->
        <path d="M 190,88 H 298" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#compress-dark-arrow)"/>
        <rect x="204" y="67" width="80" height="12" rx="2" fill="#1a1614"/>
        <text x="244" y="76" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LARGE RESULT</text>
        <path d="M 480,80 H 738" fill="none" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#compress-dark-arrow-link)"/>
        <rect x="542" y="59" width="136" height="12" rx="2" fill="#1a1614"/>
        <text x="610" y="68" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THE DIGEST, EVERY TURN</text>
        <path d="M 480,104 H 592 Q 600,104 600,112 V 226 Q 600,234 608,234 H 738" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#compress-dark-arrow)"/>
        <rect x="623" y="213" width="90" height="12" rx="2" fill="#1a1614"/>
        <text x="668" y="222" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE A DIGEST</text>
        <path d="M 390,116 V 218" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#compress-dark-arrow)"/>
        <rect x="406" y="163" width="56" height="12" rx="2" fill="#1a1614"/>
        <text x="434" y="172" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KEEPS IT</text>
        <path d="M 110,116 V 226 Q 110,234 118,234 H 298" fill="none" stroke="#a89e8f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#compress-dark-arrow)"/>
        <rect x="163" y="213" width="74" height="12" rx="2" fill="#1a1614"/>
        <text x="200" y="222" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL_OUTPUT</text>

        <!-- Nodes -->
        <rect x="30" y="60" width="160" height="56" rx="6" fill="#1a1614"/>
        <rect x="30" y="60" width="160" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="110" y="86" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <text x="110" y="102" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">a tool result</text>
        <rect x="300" y="60" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="300" y="60" width="180" height="56" rx="6" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="390" y="86" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="390" y="102" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">over minBytes?</text>
        <rect x="740" y="52" width="190" height="56" rx="6" fill="#1a1614"/>
        <rect x="740" y="52" width="190" height="56" rx="6" fill="#f4ecdd" stroke="#f4ecdd" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="835" y="78" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Anthropic API</text>
        <text x="835" y="94" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">sees the digest</text>
        <rect x="740" y="206" width="190" height="56" rx="6" fill="#1a1614"/>
        <rect x="740" y="206" width="190" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="835" y="232" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="835" y="248" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">writes the digest</text>
        <rect x="300" y="220" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="300" y="220" width="180" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="390" y="246" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">originals/</text>
        <text x="390" y="262" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">for retainDays</text>
        <text x="200" y="310" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">when the digest isn’t enough, Claude asks for the original</text>
        <text x="740" y="310" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">same bytes on every turn, so the cache holds</text>
        <line x1="30" y1="332" x2="930" y2="332" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="360" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="356" x2="132" y2="356" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#compress-dark-arrow-link)"/>
        <text x="140" y="360" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="356" x2="282" y2="356" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#compress-dark-arrow)"/>
        <text x="290" y="360" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">On your machine</text>
        <line x1="410" y1="356" x2="442" y2="356" stroke="#a89e8f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#compress-dark-arrow)"/>
        <text x="450" y="360" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Only when Claude asks</text>
      </svg>
