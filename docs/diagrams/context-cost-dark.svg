<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-cost-dark-title context-cost-dark-desc" id="context-cost-dark-root">
        <title id="context-cost-dark-title">What a turn costs as the conversation grows</title>
        <desc id="context-cost-dark-desc">Over a week of real use, the median main-conversation turn cost $0.041 under 200k tokens of context, $0.076 from 200k to 400k, $0.124 from 400k to 600k, and $0.181 over 600k, where 13% of the turns made 33% of the cost.</desc>
        <defs>
      <style>#context-cost-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #context-cost-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #context-cost-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #context-cost-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="context-cost-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="context-cost-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="context-cost-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Axis and gridlines -->
        <line x1="140" y1="210" x2="900" y2="210" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="128" y="213" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.05</text>
        <line x1="140" y1="160" x2="900" y2="160" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="128" y="163" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.10</text>
        <line x1="140" y1="110" x2="900" y2="110" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="128" y="113" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.15</text>
        <line x1="140" y1="60" x2="900" y2="60" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="128" y="63" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.20</text>
        <line x1="140" y1="260" x2="900" y2="260" stroke="#f4ecdd" stroke-width="1" stroke-opacity="0.30"/>
        <text x="128" y="263" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0</text>
        <text x="30" y="48" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">MEDIAN COST OF ONE TURN</text>

        <!-- Bars -->
        <rect x="180" y="219" width="120" height="41" fill="#5ba3b8" stroke="#5ba3b8" stroke-width="1" fill-opacity="0.18"/>
        <text x="240" y="211" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.041</text>
        <text x="240" y="282" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">under 200k</text>
        <text x="240" y="300" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">44% of turns</text>
        <text x="240" y="316" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">22% of the cost</text>
        <rect x="360" y="184" width="120" height="76" fill="#5ba3b8" stroke="#5ba3b8" stroke-width="1" fill-opacity="0.18"/>
        <text x="420" y="176" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.076</text>
        <text x="420" y="282" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">200k to 400k</text>
        <text x="420" y="300" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">34% of turns</text>
        <text x="420" y="316" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">32% of the cost</text>
        <rect x="540" y="136" width="120" height="124" fill="#5ba3b8" stroke="#5ba3b8" stroke-width="1" fill-opacity="0.18"/>
        <text x="600" y="128" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.124</text>
        <text x="600" y="282" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">400k to 600k</text>
        <text x="600" y="300" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">9% of turns</text>
        <text x="600" y="316" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">12% of the cost</text>
        <rect x="720" y="79" width="120" height="181" fill="#e24a8a" stroke="#e24a8a" stroke-width="1" fill-opacity="0.10"/>
        <text x="780" y="71" fill="#e24a8a" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.181</text>
        <text x="780" y="282" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">over 600k</text>
        <text x="780" y="300" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">13% of turns</text>
        <text x="780" y="316" fill="#e24a8a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">33% of the cost</text>
        <text x="180" y="96" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">a turn reads the whole conversation from the cache,</text>
        <text x="180" y="114" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">so a /compact or a new session makes the next one cheaper</text>

        <!-- Legend -->
        <line x1="30" y1="344" x2="930" y2="344" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="372" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="361" width="24" height="14" fill="#5ba3b8" stroke="#5ba3b8" stroke-width="1" fill-opacity="0.18"/>
        <text x="132" y="372" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Median cost of a main-conversation turn, at list price</text>
        <rect x="420" y="361" width="24" height="14" fill="#e24a8a" stroke="#e24a8a" stroke-width="1" fill-opacity="0.10"/>
        <text x="452" y="372" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Over 600k: an eighth of the turns, a third of the cost</text>
        <text x="930" y="372" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">a week of real use, 12 to 19 October 2026</text>
      </svg>
