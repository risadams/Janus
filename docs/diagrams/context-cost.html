<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What a turn costs as the conversation grows</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · Janus · Ris Ink</p>
    <h1>What a turn costs as the conversation grows</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-cost-title context-cost-desc">
        <title id="context-cost-title">What a turn costs as the conversation grows</title>
        <desc id="context-cost-desc">Over a week of real use, the median main-conversation turn cost $0.041 under 200k tokens of context, $0.076 from 200k to 400k, $0.124 from 400k to 600k, and $0.181 over 600k, where 13% of the turns made 33% of the cost.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Axis and gridlines -->
        <line x1="140" y1="210" x2="900" y2="210" stroke="rgba(26,22,20,0.08)" stroke-width="0.8"/>
        <text x="128" y="213" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.05</text>
        <line x1="140" y1="160" x2="900" y2="160" stroke="rgba(26,22,20,0.08)" stroke-width="0.8"/>
        <text x="128" y="163" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.10</text>
        <line x1="140" y1="110" x2="900" y2="110" stroke="rgba(26,22,20,0.08)" stroke-width="0.8"/>
        <text x="128" y="113" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.15</text>
        <line x1="140" y1="60" x2="900" y2="60" stroke="rgba(26,22,20,0.08)" stroke-width="0.8"/>
        <text x="128" y="63" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0.20</text>
        <line x1="140" y1="260" x2="900" y2="260" stroke="rgba(26,22,20,0.30)" stroke-width="1"/>
        <text x="128" y="263" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">$0</text>
        <text x="30" y="48" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">MEDIAN COST OF ONE TURN</text>

        <!-- Bars -->
        <rect x="180" y="219" width="120" height="41" fill="rgba(26,91,110,0.18)" stroke="#1a5b6e" stroke-width="1"/>
        <text x="240" y="211" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.041</text>
        <text x="240" y="282" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">under 200k</text>
        <text x="240" y="300" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">44% of turns</text>
        <text x="240" y="316" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">22% of the cost</text>
        <rect x="360" y="184" width="120" height="76" fill="rgba(26,91,110,0.18)" stroke="#1a5b6e" stroke-width="1"/>
        <text x="420" y="176" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.076</text>
        <text x="420" y="282" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">200k to 400k</text>
        <text x="420" y="300" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">34% of turns</text>
        <text x="420" y="316" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">32% of the cost</text>
        <rect x="540" y="136" width="120" height="124" fill="rgba(26,91,110,0.18)" stroke="#1a5b6e" stroke-width="1"/>
        <text x="600" y="128" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.124</text>
        <text x="600" y="282" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">400k to 600k</text>
        <text x="600" y="300" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">9% of turns</text>
        <text x="600" y="316" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">12% of the cost</text>
        <rect x="720" y="79" width="120" height="181" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1"/>
        <text x="780" y="71" fill="#CB0162" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">$0.181</text>
        <text x="780" y="282" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">over 600k</text>
        <text x="780" y="300" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">13% of turns</text>
        <text x="780" y="316" fill="#CB0162" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">33% of the cost</text>
        <text x="180" y="96" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">a turn reads the whole conversation from the cache,</text>
        <text x="180" y="114" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">so a /compact or a new session makes the next one cheaper</text>

        <!-- Legend -->
        <line x1="30" y1="344" x2="930" y2="344" stroke="rgba(26,22,20,0.10)" stroke-width="0.8"/>
        <text x="30" y="372" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="361" width="24" height="14" fill="rgba(26,91,110,0.18)" stroke="#1a5b6e" stroke-width="1"/>
        <text x="132" y="372" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Median cost of a main-conversation turn, at list price</text>
        <rect x="420" y="361" width="24" height="14" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1"/>
        <text x="452" y="372" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Over 600k: an eighth of the turns, a third of the cost</text>
        <text x="930" y="372" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">a week of real use, 12 to 19 October 2026</text>
      </svg>
    </div>
  </div>
</body>
</html>
