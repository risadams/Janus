        <path d="M 690,176 H 728" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#machines-dark-arrow)"/>
        <path d="M 340,204 V 252" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#machines-dark-arrow)"/>
