        <text x="140" y="420" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="416" x2="282" y2="416" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#machines-dark-arrow)"/>
        <text x="290" y="420" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Janus to LM Studio</text>
