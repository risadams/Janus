        <path d="M 820,204 V 268" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#machines-dark-arrow)"/>
        <rect x="731" y="227" width="74" height="12" rx="2" fill="#1a1614"/>
        <text x="768" y="236" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THE NETWORK</text>

