        <rect x="730" y="148" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="730" y="148" width="180" height="56" rx="6" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="820" y="174" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="820" y="190" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="820" y="296" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="820" y="312" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:1234, on the network</text>
        <text x="245" y="368" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">simplest, and nothing is exposed</text>
        <text x="720" y="368" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">serve on the network; prefer an IP to .local</text>
        <line x1="30" y1="392" x2="930" y2="392" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="420" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
