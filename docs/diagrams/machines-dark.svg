<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="machines-dark-title machines-dark-desc" id="machines-dark-root">
        <title id="machines-dark-title">One machine or two</title>
        <desc id="machines-dark-desc">Janus always runs on the same machine as Claude Code; LM Studio runs either there, on loopback, or on another machine with more memory, reached over the network.</desc>
        <defs>
      <style>#machines-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #machines-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #machines-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #machines-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="machines-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="machines-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="machines-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Arrows first -->
