<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One machine or two</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Janus · Ris Ink</p>
    <h1>One machine or two</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="machines-title machines-desc">
        <title id="machines-title">One machine or two</title>
        <desc id="machines-desc">Janus always runs on the same machine as Claude Code; LM Studio runs either there, on loopback, or on another machine with more memory, reached over the network.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Arrows first -->
        <path d="M 340,148 V 56 Q 340,48 348,48 H 378" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 820,148 V 56 Q 820,48 812,48 H 582" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 210,176 H 248" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 690,176 H 728" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 340,204 V 252" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="361" y="223" width="62" height="12" rx="2" fill="#faf6ef"/>
        <text x="392" y="232" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">127.0.0.1</text>
        <path d="M 820,204 V 268" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="731" y="227" width="74" height="12" rx="2" fill="#faf6ef"/>
        <text x="768" y="236" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THE NETWORK</text>

        <!-- Machines -->
        <rect x="30" y="112" width="430" height="228" rx="8" fill="none" stroke="rgba(26,22,20,0.30)" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="46" y="132" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ONE MACHINE</text>
        <rect x="510" y="112" width="420" height="104" rx="8" fill="none" stroke="rgba(26,22,20,0.30)" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="526" y="132" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">YOUR COMPUTER</text>
        <rect x="510" y="244" width="420" height="96" rx="8" fill="none" stroke="rgba(26,22,20,0.30)" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="526" y="264" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ANOTHER MACHINE, MORE MEMORY</text>

        <!-- Nodes -->
        <rect x="380" y="20" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="380" y="20" width="200" height="56" rx="6" fill="rgba(26,22,20,0.03)" stroke="rgba(26,22,20,0.30)" stroke-width="1"/>
        <text x="480" y="46" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Anthropic API</text>
        <text x="480" y="62" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>
        <rect x="50" y="148" width="160" height="56" rx="6" fill="#faf6ef"/>
        <rect x="50" y="148" width="160" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="130" y="180" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <rect x="250" y="148" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="250" y="148" width="180" height="56" rx="6" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1.2"/>
        <text x="340" y="174" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="340" y="190" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="250" y="254" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="250" y="254" width="180" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="340" y="280" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="340" y="296" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:1234, loopback only</text>
        <rect x="530" y="148" width="160" height="56" rx="6" fill="#faf6ef"/>
        <rect x="530" y="148" width="160" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="610" y="180" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <rect x="730" y="148" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="730" y="148" width="180" height="56" rx="6" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1.2"/>
        <text x="820" y="174" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="820" y="190" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="820" y="296" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="820" y="312" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:1234, on the network</text>
        <text x="245" y="368" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">simplest, and nothing is exposed</text>
        <text x="720" y="368" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">serve on the network; prefer an IP to .local</text>
        <line x1="30" y1="392" x2="930" y2="392" stroke="rgba(26,22,20,0.10)" stroke-width="0.8"/>
        <text x="30" y="420" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="416" x2="132" y2="416" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="140" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="416" x2="282" y2="416" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="290" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Janus to LM Studio</text>
        <rect x="420" y="409" width="24" height="14" rx="3" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1"/>
        <text x="452" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Janus always stays beside Claude Code</text>
      </svg>
    </div>
  </div>
</body>
</html>
