<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="machines-title machines-desc" id="machines-root">
        <title id="machines-title">One machine or two</title>
        <desc id="machines-desc">Janus always runs on the same machine as Claude Code; LM Studio runs either there, on loopback, or on another machine with more memory, reached over the network.</desc>
        <defs>
      <style>#machines-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #machines-root { font-family: var(--font-serif); color: var(--color-ink); }
      #machines-root .diagram-container { width: 100%; overflow-x: auto; }
      #machines-root .diagram-container { overflow-x: visible; }</style>
          <marker id="machines-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="machines-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="machines-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Arrows first -->
        <path d="M 340,148 V 56 Q 340,48 348,48 H 378" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#machines-arrow-link)"/>
        <path d="M 820,148 V 56 Q 820,48 812,48 H 582" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#machines-arrow-link)"/>
        <path d="M 210,176 H 248" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#machines-arrow)"/>
        <path d="M 690,176 H 728" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#machines-arrow)"/>
        <path d="M 340,204 V 252" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#machines-arrow)"/>
        <rect x="361" y="223" width="62" height="12" rx="2" fill="#faf6ef"/>
        <text x="392" y="232" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">127.0.0.1</text>
        <path d="M 820,204 V 268" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#machines-arrow)"/>
        <rect x="731" y="227" width="74" height="12" rx="2" fill="#faf6ef"/>
        <text x="768" y="236" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THE NETWORK</text>

        <!-- Machines -->
        <rect x="30" y="112" width="430" height="228" rx="8" fill="none" stroke="#1a1614" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.30"/>
        <text x="46" y="132" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ONE MACHINE</text>
        <rect x="510" y="112" width="420" height="104" rx="8" fill="none" stroke="#1a1614" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.30"/>
        <text x="526" y="132" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">YOUR COMPUTER</text>
        <rect x="510" y="244" width="420" height="96" rx="8" fill="none" stroke="#1a1614" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.30"/>
        <text x="526" y="264" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ANOTHER MACHINE, MORE MEMORY</text>

        <!-- Nodes -->
        <rect x="380" y="20" width="200" height="56" rx="6" fill="#faf6ef"/>
