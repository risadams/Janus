        <text x="130" y="180" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <rect x="250" y="148" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="250" y="148" width="180" height="56" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="340" y="174" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="340" y="190" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="250" y="254" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="250" y="254" width="180" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="340" y="280" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="340" y="296" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:1234, loopback only</text>
        <rect x="530" y="148" width="160" height="56" rx="6" fill="#faf6ef"/>
        <rect x="530" y="148" width="160" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="610" y="180" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <rect x="730" y="148" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="730" y="148" width="180" height="56" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="820" y="174" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="820" y="190" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="730" y="270" width="180" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="820" y="296" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="820" y="312" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:1234, on the network</text>
        <text x="245" y="368" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">simplest, and nothing is exposed</text>
        <text x="720" y="368" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">serve on the network; prefer an IP to .local</text>
        <line x1="30" y1="392" x2="930" y2="392" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="420" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="416" x2="132" y2="416" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#machines-arrow-link)"/>
        <text x="140" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="416" x2="282" y2="416" stroke="#6b625a" stroke-width="1.2" marker-end="url(#machines-arrow)"/>
        <text x="290" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Janus to LM Studio</text>
        <rect x="420" y="409" width="24" height="14" rx="3" fill="#cb0162" stroke="#CB0162" stroke-width="1" fill-opacity="0.08"/>
        <text x="452" y="420" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Janus always stays beside Claude Code</text>
      </svg>
