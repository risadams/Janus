<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="move-and-return-dark-title move-and-return-dark-desc" id="move-and-return-dark-root">
        <title id="move-and-return-dark-title">Moving and coming back</title>
        <desc id="move-and-return-dark-desc">Claude answers turns 1 to 3; at turn 4 it refuses with a usage limit that resets at 12:00, so turns 4 to 7 go to OpenAI without Claude being asked; turn 8, after the reset, goes back to Claude, and the console says how many turns OpenAI gave.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #move-and-return-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #move-and-return-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #move-and-return-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #move-and-return-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="move-and-return-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="move-and-return-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>
        <!-- Lanes and arrows first -->
        <line x1="150" y1="110" x2="468" y2="110" stroke="#f4ecdd" stroke-width="1" stroke-opacity="0.10"/>
        <line x1="468" y1="110" x2="852" y2="110" stroke="#a89e8f" stroke-width="1.2" stroke-dasharray="4,3"/>
        <line x1="150" y1="210" x2="892" y2="210" stroke="#f4ecdd" stroke-width="1" stroke-opacity="0.10"/>
        <rect x="628.8" y="105" width="62.4" height="12" rx="2" fill="#1a1614"/>
        <text x="660.0" y="114" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOT ASKED</text>
        <path d="M 468,118 V 200" fill="none" stroke="#e24a8a" stroke-width="1.4" marker-end="url(#move-and-return-dark-arrow-accent)"/>
        <rect x="478" y="154" width="60" height="12" rx="2" fill="#1a1614"/>
        <text x="508" y="163" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">429 LIMIT</text>
        <line x1="804.0" y1="70" x2="804.0" y2="240" stroke="#a89e8f" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="767.2" y="53" width="73.6" height="12" rx="2" fill="#1a1614"/>
        <text x="804.0" y="62" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">12:00 RESET</text>

        <!-- Lane names and turns -->
        <text x="40" y="114" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" font-weight="600">Claude</text>
        <text x="40" y="214" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" font-weight="600">OpenAI</text>
        <circle cx="180" cy="110" r="7" fill="#1a1614"/>
        <circle cx="180" cy="110" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="180" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 1</text>
        <circle cx="276" cy="110" r="7" fill="#1a1614"/>
        <circle cx="276" cy="110" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="276" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 2</text>
        <circle cx="372" cy="110" r="7" fill="#1a1614"/>
        <circle cx="372" cy="110" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="372" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 3</text>
        <circle cx="468" cy="210" r="7" fill="#1a1614"/>
        <circle cx="468" cy="210" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="468" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 4</text>
        <circle cx="564" cy="210" r="7" fill="#1a1614"/>
        <circle cx="564" cy="210" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="564" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 5</text>
        <circle cx="660" cy="210" r="7" fill="#1a1614"/>
        <circle cx="660" cy="210" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="660" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 6</text>
        <circle cx="756" cy="210" r="7" fill="#1a1614"/>
        <circle cx="756" cy="210" r="7" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="756" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 7</text>
        <circle cx="852" cy="110" r="7" fill="#1a1614"/>
        <circle cx="852" cy="110" r="7" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="852" y="268" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TURN 8</text>
        <circle cx="468" cy="110" r="7" fill="#1a1614"/>
        <circle cx="468" cy="110" r="7" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="860" y="300" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">turn 8, the console: “Claude is answering again,</text>
        <text x="860" y="318" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">after 4 turns from OpenAI”</text>
        <line x1="30" y1="340" x2="930" y2="340" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="368" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <circle cx="112" cy="364" r="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="140" y="368" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">A turn answered</text>
        <circle cx="261.5" cy="364" r="6" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="289.5" y="368" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Claude refusing, and answering again</text>
        <line x1="501.9" y1="364" x2="533.9" y2="364" stroke="#a89e8f" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="541.9" y="368" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Claude not asked, its limit not yet reset</text>

      </svg>
