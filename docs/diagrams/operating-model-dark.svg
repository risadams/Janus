        <rect x="621" y="307" width="102" height="12" rx="2" fill="#1a1614"/>
        <text x="672" y="316" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READS FOR CLAUDE</text>

