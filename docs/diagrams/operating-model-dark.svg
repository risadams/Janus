        <rect x="638" y="47" width="68" height="12" rx="2" fill="#1a1614"/>
        <text x="672" y="56" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPRESSED</text>
        <path d="M 480,180 H 632 Q 640,180 640,188 V 260 Q 640,268 648,268 H 738" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#operating-model-dark-arrow)"/>
