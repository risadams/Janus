<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operating-model-dark-title operating-model-dark-desc" id="operating-model-dark-root">
        <title id="operating-model-dark-title">Claude is the brain, the local model the workhorse</title>
        <desc id="operating-model-dark-desc">Claude Code sends every request to Janus, which classifies, guards, and routes it: to Anthropic, compressed, or to the local model, escalating to Claude when a local answer fails; Claude can also delegate reading to the local model through janus mcp, and every decision goes in the ledger.</desc>
        <defs>
      <style>#operating-model-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #operating-model-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #operating-model-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #operating-model-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="operating-model-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="operating-model-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="operating-model-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

