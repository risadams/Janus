        <text x="390" y="166" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="390" y="182" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">classify · guard · route</text>
        <rect x="300" y="46" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="300" y="46" width="180" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="390" y="72" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Ledger</text>
        <text x="390" y="88" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">every decision and cost</text>
        <rect x="740" y="40" width="190" height="56" rx="6" fill="#1a1614"/>
        <rect x="740" y="40" width="190" height="56" rx="6" fill="#f4ecdd" stroke="#f4ecdd" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="835" y="66" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Anthropic API</text>
        <text x="835" y="82" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Claude, the brain</text>
        <rect x="740" y="240" width="190" height="56" rx="6" fill="#1a1614"/>
        <rect x="740" y="240" width="190" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="835" y="266" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="835" y="282" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the workhorse</text>
        <rect x="300" y="300" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="300" y="300" width="180" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="390" y="326" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">janus mcp</text>
        <text x="390" y="342" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">worker tools</text>
        <text x="30" y="392" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">route: whole kinds of request go local · escalate: a local answer that fails its checks goes to Claude</text>
        <text x="30" y="410" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">delegate: Claude hands reading to the local model · compress: large results shrink before they go up</text>
        <line x1="30" y1="428" x2="930" y2="428" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="456" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="452" x2="132" y2="452" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#operating-model-dark-arrow-link)"/>
        <text x="140" y="456" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="452" x2="282" y2="452" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#operating-model-dark-arrow)"/>
        <text x="290" y="456" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">On your machine</text>
