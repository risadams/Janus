        <path d="M 390,140 V 104" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#operating-model-dark-arrow)"/>
        <rect x="398" y="115" width="52" height="12" rx="2" fill="#1a1614"/>
        <text x="424" y="124" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECORDS</text>
