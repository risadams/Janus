<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="privacy-levels-title privacy-levels-desc" id="privacy-levels-root">
        <title id="privacy-levels-title">Three levels of keeping things in</title>
        <desc id="privacy-levels-desc">The guard first only finds secrets and records them; with redaction it replaces them with placeholders on the way to Anthropic and restores them in the answer; with a local-only policy it withholds named files, folders, and marked text whatever they contain.</desc>
        <defs>
      <style>#privacy-levels-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #privacy-levels-root { font-family: var(--font-serif); color: var(--color-ink); }
      #privacy-levels-root .diagram-container { width: 100%; overflow-x: auto; }
      #privacy-levels-root .diagram-container { overflow-x: visible; }</style>
          <marker id="privacy-levels-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="privacy-levels-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="privacy-levels-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- The direction of protection -->
        <path d="M 60,52 H 900" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#privacy-levels-arrow-accent)"/>
        <rect x="370" y="40" width="220" height="16" rx="2" fill="#faf6ef"/>
        <text x="480" y="52" fill="#CB0162" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KEEP MORE ON YOUR MACHINE</text>
        <rect x="30" y="172" width="280" height="192" rx="6" fill="#faf6ef"/>
        <rect x="30" y="172" width="280" height="192" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="46" y="198" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">1. Find out</text>
        <text x="46" y="216" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">"guard": true</text>
        <text x="46" y="242" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Looks at every request going to</text>
        <text x="46" y="257" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Anthropic and records the secrets in it.</text>
        <text x="46" y="272" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Changes nothing.</text>
        <text x="46" y="312" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ANTHROPIC SEES</text>
        <text x="46" y="326" fill="#CB0162" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">the secret, as before</text>
        <text x="46" y="344" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">CATCHES</text>
        <text x="46" y="358" fill="#1a1614" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">secrets, by pattern</text>
        <rect x="340" y="128" width="280" height="236" rx="6" fill="#faf6ef"/>
        <rect x="340" y="128" width="280" height="236" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="356" y="154" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">2. Replace secrets</text>
        <text x="356" y="172" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">"redact": true</text>
        <text x="356" y="198" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Swaps each secret for a placeholder on</text>
        <text x="356" y="213" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">the way out, and puts it back in the</text>
        <text x="356" y="228" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">answer.</text>
        <text x="356" y="312" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ANTHROPIC SEES</text>
        <text x="356" y="326" fill="#1a1614" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">a placeholder</text>
        <text x="356" y="344" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">CATCHES</text>
        <text x="356" y="358" fill="#1a1614" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">secrets, by pattern</text>
        <rect x="650" y="84" width="280" height="280" rx="6" fill="#faf6ef"/>
        <rect x="650" y="84" width="280" height="280" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="666" y="110" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">3. Keep files local</text>
        <text x="666" y="128" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">"localOnly": {...}</text>
        <text x="666" y="154" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Withholds the files, folders, and marked</text>
        <text x="666" y="169" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">text you name, whatever is in them.</text>
        <text x="666" y="312" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ANTHROPIC SEES</text>
        <text x="666" y="326" fill="#1a1614" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">a notice, or nothing</text>
        <text x="666" y="344" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">CATCHES</text>
        <text x="666" y="358" fill="#1a1614" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">anything in the places you name</text>
        <text x="480" y="396" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">start at 1 and read what it finds before turning on 2 and 3</text>
        <line x1="30" y1="416" x2="930" y2="416" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="444" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="433" width="24" height="14" rx="3" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="132" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">A level of the guard, each a setting</text>
        <line x1="360" y1="440" x2="392" y2="440" stroke="#CB0162" stroke-width="1.4" marker-end="url(#privacy-levels-arrow-accent)"/>
        <text x="400" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Each keeps more from Anthropic than the last</text>
      </svg>
