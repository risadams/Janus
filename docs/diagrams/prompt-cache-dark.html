<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why a block once sent never changes</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Turns · Janus · Ris Ink</p>
    <h1>Why a block once sent never changes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prompt-cache-dark-title prompt-cache-dark-desc">
        <title id="prompt-cache-dark-title">Why a block once sent never changes</title>
        <desc id="prompt-cache-dark-desc">Each turn of a conversation resends everything before it. Blocks sent unchanged are read from the prompt cache at a tenth of the input price; if one earlier block changes, it and everything after it are written to the cache again at twice the input price, so Janus sends every block in the same bytes on every turn.</desc>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Column heads -->
        <text x="252" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SYSTEM</text>
        <text x="386" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TOOLS</text>
        <text x="518" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 1</text>
        <text x="630" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 2</text>
        <text x="742" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TURN 3</text>
        <text x="868" y="20" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">COST</text>

        <!-- Row 1: the first request writes everything -->
        <text x="30" y="56" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">First request</text>
        <text x="30" y="72" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">all new</text>
        <rect x="196" y="36" width="112" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="252" y="62" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <rect x="312" y="36" width="148" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="386" y="62" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <rect x="464" y="36" width="108" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="518" y="62" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="62" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">all written</text>

        <!-- Row 2: the next turn reads what it sent before -->
        <text x="30" y="128" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Next turn</text>
        <text x="30" y="144" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">same bytes again</text>
        <rect x="196" y="108" width="112" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="252" y="134" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="108" width="148" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="386" y="134" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="108" width="108" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="518" y="134" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="576" y="108" width="108" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="630" y="134" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="134" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">mostly read</text>

        <!-- Row 3: an earlier block was changed -->
        <text x="30" y="200" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">If turn 1 changed</text>
        <text x="30" y="216" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">what Janus never does</text>
        <rect x="196" y="180" width="112" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="252" y="206" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="180" width="148" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="386" y="206" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="180" width="108" height="44" rx="6" fill="rgba(226,74,138,0.10)" stroke="#e24a8a" stroke-width="1.2"/>
        <text x="518" y="206" fill="#e24a8a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">changed</text>
        <rect x="576" y="180" width="108" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="630" y="206" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write again</text>
        <rect x="688" y="180" width="108" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="742" y="206" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="206" fill="#e24a8a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">all after it written</text>
        <!-- Bracket under what is written again -->
        <path d="M 464,232 V 240 H 796 V 232" fill="none" stroke="#a89e8f" stroke-width="1"/>
        <text x="630" y="256" fill="#a89e8f" font-size="13" font-style="italic" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">everything from the change on is paid for again, twenty times a read</text>

        <!-- Row 4: what Janus does -->
        <text x="30" y="304" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">As Janus sends it</text>
        <text x="30" y="320" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace">a change made once, kept</text>
        <rect x="196" y="284" width="112" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="252" y="310" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="312" y="284" width="148" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="386" y="310" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="464" y="284" width="108" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="518" y="310" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="576" y="284" width="108" height="44" rx="6" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="630" y="310" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">read</text>
        <rect x="688" y="284" width="108" height="44" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="742" y="310" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write</text>
        <text x="868" y="310" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">mostly read</text>

        <!-- Legend -->
        <line x1="30" y1="352" x2="930" y2="352" stroke="rgba(244,236,221,0.10)" stroke-width="0.8"/>
        <text x="30" y="380" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="370" width="24" height="14" rx="3" fill="rgba(168,158,143,0.10)" stroke="#948b7d" stroke-width="1"/>
        <text x="132" y="380" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Read from the cache: a tenth of the input price</text>
        <rect x="380" y="370" width="24" height="14" rx="3" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="412" y="380" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Written to the cache: twice the input price</text>
        <rect x="640" y="370" width="24" height="14" rx="3" fill="rgba(226,74,138,0.10)" stroke="#e24a8a" stroke-width="1.2"/>
        <text x="672" y="380" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">A block sent before, now different</text>
      </svg>
    </div>
  </div>
</body>
</html>
