<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="provider-chain-title provider-chain-desc" id="provider-chain-root">
        <title id="provider-chain-title">A rule's list of providers</title>
        <desc id="provider-chain-desc">A request goes to Claude first; if Claude cannot answer it goes to OpenAI, and if OpenAI cannot either, to the local model; each is passed over without being asked when the request may not go there or it waits for a limit to reset, and with none left janus refuses the request.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #provider-chain-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #provider-chain-root { font-family: var(--font-serif); color: var(--color-ink); }
      #provider-chain-root .diagram-container { width: 100%; overflow-x: auto; }
      #provider-chain-root .diagram-container { overflow-x: visible; }</style>
          <marker id="provider-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="provider-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>
        <!-- Arrows first -->
        <path d="M 230,60 V 94" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#provider-chain-arrow)"/>
        <path d="M 230,152 V 210" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#provider-chain-arrow)"/>
        <path d="M 230,268 V 326" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#provider-chain-arrow)"/>
        <path d="M 230,384 V 442" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#provider-chain-arrow)"/>
        <rect x="250.4" y="176" width="79.2" height="12" rx="2" fill="#faf6ef"/>
        <text x="290" y="185" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CAN'T ANSWER</text>
        <rect x="250.4" y="292" width="79.2" height="12" rx="2" fill="#faf6ef"/>
        <text x="290" y="301" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CAN'T ANSWER</text>
        <rect x="243.8" y="408" width="62.4" height="12" rx="2" fill="#faf6ef"/>
        <text x="275" y="417" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NONE LEFT</text>
        <path d="M 330,124 H 618" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#provider-chain-arrow-accent)"/>
        <path d="M 330,240 H 618" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#provider-chain-arrow-accent)"/>
        <path d="M 330,356 H 618" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#provider-chain-arrow-accent)"/>
        <rect x="448.4" y="109" width="51.2" height="12" rx="2" fill="#faf6ef"/>
        <text x="474" y="118" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSWERS</text>
        <path d="M 130,128 H 106 Q 98,128 98,136 V 220 Q 98,228 106,228 H 128" fill="none" stroke="#6b625a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#provider-chain-arrow)"/>
        <path d="M 130,252 H 106 Q 98,252 98,260 V 336 Q 98,344 106,344 H 128" fill="none" stroke="#6b625a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#provider-chain-arrow)"/>
        <rect x="15" y="177" width="70" height="12" rx="2" fill="#faf6ef"/>
        <text x="50" y="186" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSED OVER</text>

        <!-- Nodes -->
        <rect x="120" y="20" width="220" height="40" rx="20" fill="#faf6ef"/>
        <rect x="120" y="20" width="220" height="40" rx="20" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="230" y="44" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">A request a rule's list covers</text>
        <rect x="130" y="96" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="130" y="96" width="200" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="230" y="120" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude</text>
        <text x="230" y="136" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">upstream</text>
        <rect x="130" y="212" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="130" y="212" width="200" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="230" y="236" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">OpenAI</text>
        <text x="230" y="252" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">openai</text>
        <rect x="130" y="328" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="130" y="328" width="200" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="230" y="352" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">The local model</text>
        <text x="230" y="368" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">LM Studio</text>
        <rect x="120" y="444" width="220" height="40" rx="20" fill="#faf6ef"/>
        <rect x="120" y="444" width="220" height="40" rx="20" fill="#1a1614" stroke="#6b625a" stroke-width="1" fill-opacity="0.05"/>
        <text x="230" y="468" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Refused: janus: …, sent nowhere</text>
        <rect x="620" y="96" width="260" height="288" rx="6" fill="#faf6ef"/>
        <rect x="620" y="96" width="260" height="288" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="750" y="236" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code gets the answer</text>
        <text x="750" y="252" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">as from the model it asked for</text>
        <text x="880" y="430" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">each is passed over, unasked, when the request may not go there</text>
        <text x="880" y="448" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">(guard.keepFrom) or it is waiting for a limit to reset</text>
        <line x1="30" y1="512" x2="930" y2="512" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="540" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="529" width="24" height="14" rx="3" fill="#cb0162" stroke="#CB0162" stroke-width="1" fill-opacity="0.08"/>
        <text x="140" y="540" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">What Claude Code receives</text>
        <line x1="298.5" y1="536" x2="330.5" y2="536" stroke="#6b625a" stroke-width="1.2" marker-end="url(#provider-chain-arrow)"/>
        <text x="338.5" y="540" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Can't answer: the next is asked</text>
        <line x1="526.4" y1="536" x2="558.4" y2="536" stroke="#6b625a" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="566.4" y="540" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Passed over, not asked</text>

      </svg>
