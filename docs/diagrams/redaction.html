<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A secret’s round trip through the guard</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Janus · Ris Ink</p>
    <h1>A secret’s round trip through the guard</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="redaction-title redaction-desc">
        <title id="redaction-title">A secret’s round trip through the guard</title>
        <desc id="redaction-desc">With redaction on, a secret Claude Code read is replaced by a placeholder before the request reaches Anthropic; Claude answers with a tool call that uses the placeholder, and Janus puts the real secret back before Claude Code acts on it.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Lifelines -->
        <line x1="160" y1="72" x2="160" y2="364" stroke="rgba(26,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="72" x2="480" y2="364" stroke="rgba(26,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="72" x2="800" y2="364" stroke="rgba(26,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation: Janus while it rewrites each way, Claude while it answers -->
        <rect x="476" y="116" width="8" height="76" fill="#faf6ef"/>
        <rect x="476" y="116" width="8" height="76" fill="rgba(26,22,20,0.06)" stroke="#6b625a" stroke-width="0.8"/>
        <rect x="476" y="260" width="8" height="84" fill="#faf6ef"/>
        <rect x="476" y="260" width="8" height="84" fill="rgba(26,22,20,0.06)" stroke="#6b625a" stroke-width="0.8"/>
        <rect x="796" y="184" width="8" height="80" fill="#faf6ef"/>
        <rect x="796" y="184" width="8" height="80" fill="rgba(26,22,20,0.06)" stroke="#6b625a" stroke-width="0.8"/>

        <!-- 1 Claude Code sends what it read, secret and all -->
        <line x1="160" y1="124" x2="474" y2="124" stroke="#6b625a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="240" y="102" width="160" height="14" rx="2" fill="#faf6ef"/>
        <text x="320" y="112" fill="#776e65" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">tool result: AWS_KEY=AKIA…</text>

        <!-- 2 Janus sends a placeholder in its place -->
        <line x1="484" y1="188" x2="794" y2="188" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="536" y="166" width="208" height="14" rx="2" fill="#faf6ef"/>
        <text x="640" y="176" fill="#776e65" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">AWS_KEY=JANUS_REDACTED_3f9a1c07b2e4</text>

        <!-- 3 Claude answers with a tool call that uses the placeholder -->
        <line x1="796" y1="264" x2="486" y2="264" stroke="#1a5b6e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="516" y="242" width="248" height="14" rx="2" fill="#faf6ef"/>
        <text x="640" y="252" fill="#776e65" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write: AWS_KEY=JANUS_REDACTED_3f9a1c07b2e4</text>

        <!-- 4 Janus puts the secret back before Claude Code acts -->
        <line x1="476" y1="340" x2="162" y2="340" stroke="#CB0162" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="258" y="318" width="124" height="14" rx="2" fill="#faf6ef"/>
        <text x="320" y="328" fill="#776e65" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">write: AWS_KEY=AKIA…</text>

        <!-- Actors -->
        <rect x="80" y="20" width="160" height="52" rx="6" fill="#faf6ef"/>
        <rect x="80" y="20" width="160" height="52" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="160" y="44" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Claude Code</text>
        <text x="160" y="60" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">your machine</text>
        <rect x="400" y="20" width="160" height="52" rx="6" fill="#faf6ef"/>
        <rect x="400" y="20" width="160" height="52" rx="6" fill="rgba(203,1,98,0.08)" stroke="#CB0162" stroke-width="1"/>
        <text x="480" y="44" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Janus</text>
        <text x="480" y="60" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">replace · restore</text>
        <rect x="720" y="20" width="160" height="52" rx="6" fill="#faf6ef"/>
        <rect x="720" y="20" width="160" height="52" rx="6" fill="rgba(26,22,20,0.03)" stroke="rgba(26,22,20,0.30)" stroke-width="1"/>
        <text x="800" y="44" fill="#1a1614" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Anthropic API</text>
        <text x="800" y="60" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>

        <!-- Callouts -->
        <text x="160" y="392" fill="#6b625a" font-size="13" font-style="italic" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">the file written holds the real key</text>
        <text x="800" y="392" fill="#6b625a" font-size="13" font-style="italic" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Claude only ever sees the placeholder</text>

        <!-- Legend -->
        <line x1="30" y1="416" x2="930" y2="416" stroke="rgba(26,22,20,0.10)" stroke-width="0.8"/>
        <text x="30" y="444" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="440" x2="132" y2="440" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="140" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">To and from Anthropic</text>
        <line x1="280" y1="440" x2="312" y2="440" stroke="#1a5b6e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <text x="320" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">The answer</text>
        <line x1="420" y1="440" x2="452" y2="440" stroke="#CB0162" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="460" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Secret put back, on this machine only</text>
      </svg>
    </div>
  </div>
</body>
</html>
