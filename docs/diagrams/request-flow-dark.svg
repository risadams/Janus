<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-flow-dark-title request-flow-dark-desc" id="request-flow-dark-root">
        <title id="request-flow-dark-title">What happens to one request</title>
        <desc id="request-flow-dark-desc">A request from Claude Code is checked against the local-only policy, planned to Anthropic or the local model, answered by the local model if its answer passes the checks or by Anthropic after repair, transforms, and redaction, and recorded in the ledger once the answer is relayed.</desc>
        <defs>
      <style>#request-flow-dark-root { --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #request-flow-dark-root { font-family: var(--font-serif); color: var(--color-ink); }
      #request-flow-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #request-flow-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="request-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="request-flow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="request-flow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Arrows first -->
        <!-- 1 start to policy -->
        <line x1="220" y1="60" x2="220" y2="88" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <!-- 2 policy to plan -->
        <line x1="220" y1="170" x2="220" y2="208" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="228" y="184" width="88" height="12" rx="2" fill="#1a1614"/>
        <text x="272" y="193" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NONE/WITHHELD</text>
        <!-- 3 policy to local: the request must stay on this machine -->
        <path d="M 310,130 H 592 Q 600,130 600,138 V 220" fill="none" stroke="#e24a8a" stroke-width="1.4" marker-end="url(#request-flow-dark-arrow-accent)"/>
        <rect x="408" y="108" width="84" height="12" rx="2" fill="#1a1614"/>
        <text x="450" y="117" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACTION LOCAL</text>
        <!-- 4 plan to prep -->
        <line x1="220" y1="290" x2="220" y2="340" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="228" y="306" width="56" height="12" rx="2" fill="#1a1614"/>
        <text x="256" y="315" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPSTREAM</text>
        <!-- 5 plan to local -->
        <line x1="310" y1="250" x2="518" y2="250" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="390" y="230" width="44" height="12" rx="2" fill="#1a1614"/>
        <text x="412" y="239" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BY RULE</text>
        <!-- 6 local to usable -->
        <line x1="600" y1="278" x2="600" y2="328" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <!-- 7 usable to prep -->
        <line x1="520" y1="370" x2="322" y2="370" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="396" y="350" width="52" height="12" rx="2" fill="#1a1614"/>
        <text x="422" y="359" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO/DOWN</text>
        <!-- 8 prep to the API -->
        <line x1="220" y1="398" x2="220" y2="444" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow-link)"/>
        <!-- 9 the API, when Claude is down, to local: bridges the YES path -->
        <path d="M 320,474 H 592 a 8,8 0 0,1 16,0 H 752 Q 760,474 760,466 V 258 Q 760,250 752,250 H 682" fill="none" stroke="#a89e8f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="768" y="356" width="68" height="12" rx="2" fill="#1a1614"/>
        <text x="802" y="365" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IF DOWN</text>
        <!-- 10 usable to relay -->
        <line x1="600" y1="410" x2="600" y2="544" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>
        <rect x="608" y="424" width="28" height="12" rx="2" fill="#1a1614"/>
        <text x="622" y="433" fill="#948b7d" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <!-- 11 the API to relay -->
        <path d="M 220,502 V 566 Q 220,574 228,574 H 498" fill="none" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow-link)"/>
        <!-- 12 relay to ledger -->
        <line x1="600" y1="602" x2="600" y2="638" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow)"/>

        <!-- Nodes -->
        <!-- Start -->
        <rect x="120" y="20" width="200" height="40" rx="20" fill="#1a1614"/>
        <rect x="120" y="20" width="200" height="40" rx="20" fill="#a89e8f" stroke="#948b7d" stroke-width="1" fill-opacity="0.10"/>
        <text x="220" y="44" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Request from Claude Code</text>

        <!-- Decision: local-only policy (focal) -->
        <polygon points="220,90 310,130 220,170 130,130" fill="#1a1614"/>
        <polygon points="220,90 310,130 220,170 130,130" fill="#e24a8a" stroke="#e24a8a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="220" y="127" fill="#f4ecdd" font-size="11" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Local-only</text>
        <text x="220" y="141" fill="#f4ecdd" font-size="11" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">content?</text>

        <!-- Decision: plan -->
        <polygon points="220,210 310,250 220,290 130,250" fill="#1a1614"/>
        <polygon points="220,210 310,250 220,290 130,250" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="220" y="247" fill="#f4ecdd" font-size="11" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Plan</text>
        <text x="220" y="261" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">alias · rule</text>

        <!-- Prepare for upstream -->
        <rect x="120" y="342" width="200" height="56" rx="6" fill="#1a1614"/>
        <rect x="120" y="342" width="200" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="220" y="366" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Prepare for Anthropic</text>
        <text x="220" y="382" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">repair · transform · redact</text>

        <!-- Anthropic API: external -->
        <rect x="120" y="446" width="200" height="56" rx="6" fill="#1a1614"/>
        <rect x="120" y="446" width="200" height="56" rx="6" fill="#f4ecdd" stroke="#f4ecdd" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="220" y="470" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Anthropic API</text>
        <text x="220" y="486" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>

        <!-- Local model answers -->
        <rect x="520" y="222" width="160" height="56" rx="6" fill="#1a1614"/>
        <rect x="520" y="222" width="160" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="600" y="246" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Local model</text>
        <text x="600" y="262" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">LM Studio</text>

        <!-- Decision: answer usable -->
        <polygon points="600,330 680,370 600,410 520,370" fill="#1a1614"/>
        <polygon points="600,330 680,370 600,410 520,370" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="600" y="367" fill="#f4ecdd" font-size="11" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Answer</text>
        <text x="600" y="381" fill="#f4ecdd" font-size="11" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">usable?</text>

        <!-- Relay -->
        <rect x="500" y="546" width="200" height="56" rx="6" fill="#1a1614"/>
        <rect x="500" y="546" width="200" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="600" y="570" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Relay to Claude Code</text>
        <text x="600" y="586" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">secrets restored</text>

        <!-- End: ledger -->
        <rect x="500" y="640" width="200" height="40" rx="20" fill="#1a1614"/>
        <rect x="500" y="640" width="200" height="40" rx="20" fill="#f4ecdd" stroke="#a89e8f" stroke-width="1" fill-opacity="0.05"/>
        <text x="600" y="664" fill="#f4ecdd" font-size="12" font-weight="600" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle">Ledger and capture</text>

        <!-- Legend -->
        <line x1="30" y1="712" x2="930" y2="712" stroke="#f4ecdd" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="740" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <polygon points="108,730 116,736 108,742 100,736" fill="#e24a8a" stroke="#e24a8a" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="740" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Privacy gate</text>
        <line x1="210" y1="736" x2="242" y2="736" stroke="#e24a8a" stroke-width="1.4" marker-end="url(#request-flow-dark-arrow-accent)"/>
        <text x="250" y="740" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Never reaches Anthropic</text>
        <line x1="400" y1="736" x2="432" y2="736" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#request-flow-dark-arrow-link)"/>
        <text x="440" y="740" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">To and from Anthropic</text>
        <line x1="580" y1="736" x2="612" y2="736" stroke="#a89e8f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#request-flow-dark-arrow)"/>
        <text x="620" y="740" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif">Only when a rule says</text>
      </svg>
