<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stand-in-title stand-in-desc" id="stand-in-root">
        <title id="stand-in-title">When the local model stands in for Claude</title>
        <desc id="stand-in-desc">When Claude cannot answer, an error about the request itself is passed on untouched; a 429 that will last a minute or more brings the local model in at once; anything else goes to Claude Code to retry, and on the third failure within two minutes the local model stands in.</desc>
        <defs>
      <style>#stand-in-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #stand-in-root { font-family: var(--font-serif); color: var(--color-ink); }
      #stand-in-root .diagram-container { width: 100%; overflow-x: auto; }
      #stand-in-root .diagram-container { overflow-x: visible; }</style>
          <marker id="stand-in-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="stand-in-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="stand-in-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Arrows first -->
        <path d="M 200,60 V 88" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <path d="M 290,130 H 418" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <rect x="340" y="109" width="28" height="12" rx="2" fill="#faf6ef"/>
        <text x="354" y="118" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <path d="M 200,170 V 208" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <rect x="210" y="183" width="24" height="12" rx="2" fill="#faf6ef"/>
        <text x="222" y="192" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <path d="M 290,250 H 678" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#stand-in-arrow-accent)"/>
        <rect x="444" y="229" width="80" height="12" rx="2" fill="#faf6ef"/>
        <text x="484" y="238" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES, A LIMIT</text>
        <path d="M 200,290 V 328" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <rect x="210" y="303" width="24" height="12" rx="2" fill="#faf6ef"/>
        <text x="222" y="312" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <path d="M 200,384 V 428" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <path d="M 290,470 H 792 Q 800,470 800,462 V 280" fill="none" stroke="#CB0162" stroke-width="1.4" marker-end="url(#stand-in-arrow-accent)"/>
        <rect x="501" y="449" width="90" height="12" rx="2" fill="#faf6ef"/>
        <text x="546" y="458" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES, AN OUTAGE</text>
        <path d="M 200,510 V 548" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <rect x="210" y="523" width="24" height="12" rx="2" fill="#faf6ef"/>
        <text x="222" y="532" fill="#776e65" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <!-- Nodes -->
        <rect x="100" y="20" width="200" height="40" rx="20" fill="#faf6ef"/>
        <rect x="100" y="20" width="200" height="40" rx="20" fill="#6b625a" stroke="#776e65" stroke-width="1" fill-opacity="0.10"/>
        <text x="200" y="44" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude could not answer</text>
        <polygon points="200,90 290,130 200,170 110,130" fill="#faf6ef"/>
        <polygon points="200,90 290,130 200,170 110,130" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="200" y="127" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">About the</text>
        <text x="200" y="141" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">request itself?</text>
        <rect x="420" y="102" width="260" height="56" rx="6" fill="#faf6ef"/>
        <rect x="420" y="102" width="260" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="550" y="128" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Error passed on untouched</text>
        <text x="550" y="144" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">bad request · expired login</text>
        <polygon points="200,210 290,250 200,290 110,250" fill="#faf6ef"/>
        <polygon points="200,210 290,250 200,290 110,250" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="200" y="247" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">A 429 for a</text>
        <text x="200" y="261" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">minute or more?</text>
        <rect x="680" y="222" width="250" height="56" rx="6" fill="#faf6ef"/>
        <rect x="680" y="222" width="250" height="56" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="805" y="248" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">The local model stands in</text>
        <text x="805" y="264" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">loads it, cuts the history to fit</text>
        <rect x="100" y="328" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="100" y="328" width="200" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="200" y="354" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Error to Claude Code</text>
        <text x="200" y="370" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">which retries</text>
        <polygon points="200,430 290,470 200,510 110,470" fill="#faf6ef"/>
        <polygon points="200,430 290,470 200,510 110,470" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="200" y="467" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Third failure</text>
        <text x="200" y="481" fill="#1a1614" font-size="11" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">in two minutes?</text>
        <rect x="100" y="548" width="200" height="40" rx="20" fill="#faf6ef"/>
        <rect x="100" y="548" width="200" height="40" rx="20" fill="#1a1614" stroke="#6b625a" stroke-width="1" fill-opacity="0.05"/>
        <text x="200" y="572" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude answers a retry</text>
        <text x="784" y="316" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">only before an answer starts:</text>
        <text x="784" y="334" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="end" font-style="italic">half an answer can’t be taken back</text>
        <line x1="30" y1="608" x2="930" y2="608" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="636" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="625" width="24" height="14" rx="3" fill="#cb0162" stroke="#CB0162" stroke-width="1" fill-opacity="0.08"/>
        <text x="132" y="636" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">The stand-in</text>
        <line x1="240" y1="632" x2="272" y2="632" stroke="#CB0162" stroke-width="1.4" marker-end="url(#stand-in-arrow-accent)"/>
        <text x="280" y="636" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Why it steps in</text>
        <line x1="400" y1="632" x2="432" y2="632" stroke="#6b625a" stroke-width="1.2" marker-end="url(#stand-in-arrow)"/>
        <text x="440" y="636" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Everything else goes to Claude Code as Claude sent it</text>
      </svg>
