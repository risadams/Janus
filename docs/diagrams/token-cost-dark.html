<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the money goes, by kind of token</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · Janus · Ris Ink</p>
    <h1>Where the money goes, by kind of token</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="token-cost-dark-title token-cost-dark-desc">
        <title id="token-cost-dark-title">Where the money goes, by kind of token</title>
        <desc id="token-cost-dark-desc">Over a week of real use, cache reads were 63% of the cost, one-hour cache writes 23%, and output 14%; uncached input and five-minute cache writes were under 1% each.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- One bar: a week of cost, by kind of token -->
        <text x="30" y="40" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">SHARE OF A WEEK’S COST</text>
        <rect x="30" y="56" width="567" height="56" fill="rgba(91,163,184,0.18)" stroke="#5ba3b8" stroke-width="1"/>
        <text x="42" y="82" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Cache reads</text>
        <text x="42" y="100" fill="#5ba3b8" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" font-weight="600">63%</text>
        <text x="42" y="136" fill="#a89e8f" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">a tenth of the input price</text>
        <rect x="597" y="56" width="207" height="56" fill="rgba(177,131,181,0.22)" stroke="#b183b5" stroke-width="1"/>
        <text x="609" y="82" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Cache writes, 1 hour</text>
        <text x="609" y="100" fill="#b183b5" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" font-weight="600">23%</text>
        <text x="609" y="136" fill="#a89e8f" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">twice the input price</text>
        <rect x="804" y="56" width="126" height="56" fill="rgba(184,135,95,0.22)" stroke="#b8875f" stroke-width="1"/>
        <text x="816" y="82" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Output</text>
        <text x="816" y="100" fill="#b8875f" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" font-weight="600">14%</text>
        <text x="816" y="136" fill="#a89e8f" font-size="10" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">thinking included</text>
        <text x="930" y="156" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">uncached input and 5-minute writes: under 1% each</text>
        <text x="30" y="188" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">Claude Code reads nearly everything from the cache, 98.8% of input here, so the cache read price</text>
        <text x="30" y="206" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-style="italic">moves the total more than anything else, and a change that breaks the cache costs most of all</text>
        <line x1="30" y1="228" x2="930" y2="228" stroke="rgba(244,236,221,0.10)" stroke-width="0.8"/>
        <text x="30" y="256" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">SOURCE</text>
        <text x="100" y="256" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">The baseline research note, priced at list price as janus stats prices it</text>
        <text x="930" y="256" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">a week of real use, 12 to 19 October 2026</text>
      </svg>
    </div>
  </div>
</body>
</html>
