<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a problem can be</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1614;
      --color-ink:     #f4ecdd;
      --color-muted:   #a89e8f;
      --color-accent:  #e24a8a;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-serif); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-variation-settings: "SOFT" 60, "WONK" 1; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Janus · Ris Ink</p>
    <h1>Where a problem can be</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="where-it-fails-dark-title where-it-fails-dark-desc">
        <title id="where-it-fails-dark-title">Where a problem can be</title>
        <desc id="where-it-fails-dark-desc">A request passes from Claude Code to Janus and on to Anthropic or LM Studio; each link has its own check: janus doctor’s claude line and the console for the first, its config, port and log checks for Janus, its upstream check and passed-through errors for Anthropic, and its local check and the console’s notes for LM Studio.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a89e8f"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e24a8a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5ba3b8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1a1614"/>

        <!-- Arrows first -->
        <path d="M 210,80 H 378" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,68 H 758" fill="none" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 580,92 H 660 Q 668,92 668,100 V 196 Q 668,204 676,204 H 758" fill="none" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <rect x="30" y="52" width="180" height="56" rx="6" fill="#1a1614"/>
        <rect x="30" y="52" width="180" height="56" rx="6" fill="#241c19" stroke="#f4ecdd" stroke-width="1"/>
        <text x="120" y="78" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <text x="120" y="94" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ANTHROPIC_BASE_URL</text>
        <rect x="380" y="52" width="200" height="56" rx="6" fill="#1a1614"/>
        <rect x="380" y="52" width="200" height="56" rx="6" fill="rgba(226,74,138,0.10)" stroke="#e24a8a" stroke-width="1.2"/>
        <text x="480" y="78" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="480" y="94" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="760" y="40" width="170" height="56" rx="6" fill="#1a1614"/>
        <rect x="760" y="40" width="170" height="56" rx="6" fill="rgba(244,236,221,0.03)" stroke="rgba(244,236,221,0.30)" stroke-width="1"/>
        <text x="845" y="66" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Anthropic API</text>
        <text x="845" y="82" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>
        <rect x="760" y="176" width="170" height="56" rx="6" fill="#1a1614"/>
        <rect x="760" y="176" width="170" height="56" rx="6" fill="rgba(244,236,221,0.03)" stroke="rgba(244,236,221,0.30)" stroke-width="1"/>
        <text x="845" y="202" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="845" y="218" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">local.baseUrl</text>

        <!-- Where each check looks -->
        <circle cx="294" cy="80" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="294" y="84" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <circle cx="580" cy="52" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="580" y="56" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">2</text>
        <circle cx="668" cy="68" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="668" y="72" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">3</text>
        <circle cx="668" cy="148" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="668" y="152" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">4</text>
        <rect x="30" y="272" width="210" height="88" rx="6" fill="#241c19" stroke="rgba(244,236,221,0.22)" stroke-width="1"/>
        <circle cx="52" cy="294" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="52" y="298" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <text x="70" y="298" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Is Claude Code on Janus?</text>
        <text x="46" y="324" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: the claude line</text>
        <text x="46" y="342" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">no console lines means no</text>
        <rect x="260" y="272" width="210" height="88" rx="6" fill="#241c19" stroke="rgba(244,236,221,0.22)" stroke-width="1"/>
        <circle cx="282" cy="294" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="282" y="298" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">2</text>
        <text x="300" y="298" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Is Janus itself well?</text>
        <text x="276" y="324" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: config, port, logs</text>
        <text x="276" y="342" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">its own errors start janus:</text>
        <rect x="490" y="272" width="210" height="88" rx="6" fill="#241c19" stroke="rgba(244,236,221,0.22)" stroke-width="1"/>
        <circle cx="512" cy="294" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="512" y="298" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">3</text>
        <text x="530" y="298" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Did Anthropic answer?</text>
        <text x="506" y="324" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: upstream</text>
        <text x="506" y="342" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">other errors are passed on as-is</text>
        <rect x="720" y="272" width="210" height="88" rx="6" fill="#241c19" stroke="rgba(244,236,221,0.22)" stroke-width="1"/>
        <circle cx="742" cy="294" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="742" y="298" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">4</text>
        <text x="760" y="298" fill="#f4ecdd" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Did the local model?</text>
        <text x="736" y="324" fill="#f4ecdd" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: local</text>
        <text x="736" y="342" fill="#a89e8f" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">the ↳ note says why it didn’t</text>
        <text x="480" y="392" fill="#a89e8f" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">Janus sits in the middle, so first find which link failed: the fix is on that side</text>

        <!-- Legend -->
        <line x1="30" y1="416" x2="930" y2="416" stroke="rgba(244,236,221,0.10)" stroke-width="0.8"/>
        <text x="30" y="444" fill="#a89e8f" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="440" x2="132" y2="440" stroke="#5ba3b8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="140" y="444" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="440" x2="282" y2="440" stroke="#a89e8f" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="290" y="444" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">On this machine or your network</text>
        <circle cx="480" cy="440" r="10" fill="#1a1614" stroke="#f4ecdd" stroke-width="1"/>
        <text x="480" y="444" fill="#f4ecdd" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <text x="496" y="444" fill="#a89e8f" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Where a check looks, and the card that says how</text>
      </svg>
    </div>
  </div>
</body>
</html>
