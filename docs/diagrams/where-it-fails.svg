<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="where-it-fails-title where-it-fails-desc" id="where-it-fails-root">
        <title id="where-it-fails-title">Where a problem can be</title>
        <desc id="where-it-fails-desc">A request passes from Claude Code to Janus and on to Anthropic or LM Studio; each link has its own check: janus doctor’s claude line and the console for the first, its config, port and log checks for Janus, its upstream check and passed-through errors for Anthropic, and its local check and the console’s notes for LM Studio.</desc>
        <defs>
      <style>#where-it-fails-root { --color-paper:   #faf6ef;
      --color-ink:     #1a1614;
      --color-muted:   #6b625a;
      --color-accent:  #CB0162;
      --font-sans:     'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-serif:    'Fraunces', 'Crimson Pro', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace; }
      #where-it-fails-root { font-family: var(--font-serif); color: var(--color-ink); }
      #where-it-fails-root .diagram-container { width: 100%; overflow-x: auto; }
      #where-it-fails-root .diagram-container { overflow-x: visible; }</style>
          <marker id="where-it-fails-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b625a"/></marker>
          <marker id="where-it-fails-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#CB0162"/></marker>
          <marker id="where-it-fails-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5b6e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#faf6ef"/>

        <!-- Arrows first -->
        <path d="M 210,80 H 378" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#where-it-fails-arrow)"/>
        <path d="M 580,68 H 758" fill="none" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#where-it-fails-arrow-link)"/>
        <path d="M 580,92 H 660 Q 668,92 668,100 V 196 Q 668,204 676,204 H 758" fill="none" stroke="#6b625a" stroke-width="1.2" marker-end="url(#where-it-fails-arrow)"/>

        <!-- Nodes -->
        <rect x="30" y="52" width="180" height="56" rx="6" fill="#faf6ef"/>
        <rect x="30" y="52" width="180" height="56" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1"/>
        <text x="120" y="78" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Claude Code</text>
        <text x="120" y="94" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ANTHROPIC_BASE_URL</text>
        <rect x="380" y="52" width="200" height="56" rx="6" fill="#faf6ef"/>
        <rect x="380" y="52" width="200" height="56" rx="6" fill="#cb0162" stroke="#CB0162" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="480" y="78" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Janus</text>
        <text x="480" y="94" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:8787</text>
        <rect x="760" y="40" width="170" height="56" rx="6" fill="#faf6ef"/>
        <rect x="760" y="40" width="170" height="56" rx="6" fill="#1a1614" stroke="#1a1614" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="845" y="66" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">Anthropic API</text>
        <text x="845" y="82" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.anthropic.com</text>
        <rect x="760" y="176" width="170" height="56" rx="6" fill="#faf6ef"/>
        <rect x="760" y="176" width="170" height="56" rx="6" fill="#1a1614" stroke="#1a1614" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="845" y="202" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-weight="600">LM Studio</text>
        <text x="845" y="218" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">local.baseUrl</text>

        <!-- Where each check looks -->
        <circle cx="294" cy="80" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="294" y="84" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <circle cx="580" cy="52" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="580" y="56" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">2</text>
        <circle cx="668" cy="68" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="668" y="72" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">3</text>
        <circle cx="668" cy="148" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="668" y="152" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">4</text>
        <rect x="30" y="272" width="210" height="88" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1" stroke-opacity="0.22"/>
        <circle cx="52" cy="294" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="52" y="298" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <text x="70" y="298" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Is Claude Code on Janus?</text>
        <text x="46" y="324" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: the claude line</text>
        <text x="46" y="342" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">no console lines means no</text>
        <rect x="260" y="272" width="210" height="88" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1" stroke-opacity="0.22"/>
        <circle cx="282" cy="294" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="282" y="298" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">2</text>
        <text x="300" y="298" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Is Janus itself well?</text>
        <text x="276" y="324" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: config, port, logs</text>
        <text x="276" y="342" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">its own errors start janus:</text>
        <rect x="490" y="272" width="210" height="88" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1" stroke-opacity="0.22"/>
        <circle cx="512" cy="294" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="512" y="298" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">3</text>
        <text x="530" y="298" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Did Anthropic answer?</text>
        <text x="506" y="324" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: upstream</text>
        <text x="506" y="342" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">other errors are passed on as-is</text>
        <rect x="720" y="272" width="210" height="88" rx="6" fill="#fffdf8" stroke="#1a1614" stroke-width="1" stroke-opacity="0.22"/>
        <circle cx="742" cy="294" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="742" y="298" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">4</text>
        <text x="760" y="298" fill="#1a1614" font-size="12" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start" font-weight="600">Did the local model?</text>
        <text x="736" y="324" fill="#1a1614" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">janus doctor: local</text>
        <text x="736" y="342" fill="#6b625a" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">the ↳ note says why it didn’t</text>
        <text x="480" y="392" fill="#6b625a" font-size="13" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="middle" font-style="italic">Janus sits in the middle, so first find which link failed: the fix is on that side</text>

        <!-- Legend -->
        <line x1="30" y1="416" x2="930" y2="416" stroke="#1a1614" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="444" fill="#6b625a" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="440" x2="132" y2="440" stroke="#1a5b6e" stroke-width="1.2" marker-end="url(#where-it-fails-arrow-link)"/>
        <text x="140" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">To Anthropic</text>
        <line x1="250" y1="440" x2="282" y2="440" stroke="#6b625a" stroke-width="1.2" marker-end="url(#where-it-fails-arrow)"/>
        <text x="290" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">On this machine or your network</text>
        <circle cx="480" cy="440" r="10" fill="#faf6ef" stroke="#1a1614" stroke-width="1"/>
        <text x="480" y="444" fill="#1a1614" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>
        <text x="496" y="444" fill="#6b625a" font-size="9" font-family="'Fraunces', 'Crimson Pro', Georgia, serif" text-anchor="start">Where a check looks, and the card that says how</text>
      </svg>
